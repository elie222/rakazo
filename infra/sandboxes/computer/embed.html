<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Computer</title>
    <style>
      html,
      body,
      #screen {
        margin: 0;
        height: 100%;
        width: 100%;
        background: #0e0e10;
        overflow: hidden;
      }
      body { display: flex; flex-direction: column; color: white; font: 14px system-ui, sans-serif; }
      #screen { flex: 1; min-height: 0; background: black; }
      #controls { display: flex; flex: none; justify-content: space-between; padding: 10px 16px; background: black; }
      #controls[hidden] { display: none; }
      button { min-height: 44px; border: 1px solid #333; border-radius: 999px; padding: 10px 16px; background: #171717; color: white; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #444; }
      button:focus-visible, textarea:focus-visible { outline: 2px solid white; outline-offset: 3px; }
      #controls button { width: 44px; padding: 10px; display: grid; place-items: center; }
      #keyboard-input { position: absolute; top: 0; left: 0; opacity: 0; width: 1px; height: 1px; font-size: 16px; }
      dialog { width: min(400px, calc(100% - 48px)); border: 1px solid #333; border-radius: 24px; padding: 20px; background: #171717; color: white; }
      dialog::backdrop { background: #0009; }
      dialog header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      dialog textarea { box-sizing: border-box; width: 100%; min-height: 140px; background: black; color: white; border: 1px solid #555; border-radius: 12px; padding: 12px; font: 16px system-ui; }
      dialog footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    </style>
    <script type="module">
      import { attachHostClipboardPaste, pasteHostText } from "./clipboard-bridge.js";
      import Keyboard from "./core/input/keyboard.js";
      import RFB from "./core/rfb.js";
      import { attachMobileControls } from "./mobile-controls.js";

      function query(name, fallback) {
        const match = `${document.location.href}${window.location.hash}`.match(
          new RegExp(`.*[?&]${name}=([^&#]*)`),
        );
        return match ? decodeURIComponent(match[1]) : fallback;
      }

      function flag(name) {
        const value = String(query(name, "false")).toLowerCase();
        return value === "1" || value === "true" || value === "yes";
      }

      const path = String(query("path", "websockify")).replace(/^\//, "");
      const prefix = window.location.pathname.replace(/[^/]+$/, "");
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const url = `${protocol}://${window.location.host}${prefix}${path}`;
      const rfb = new RFB(document.getElementById("screen"), url);
      rfb.viewOnly = flag("view_only");
      rfb.scaleViewport = true;
      rfb.clipViewport = false;
      if (!rfb.viewOnly) {
        attachHostClipboardPaste(rfb, { target: document.getElementById("screen") });
        attachMobileControls(rfb, Keyboard, pasteHostText);
      }
    </script>
  </head>
  <body>
    <div id="screen"></div>
    <div id="controls" hidden>
      <button type="button" id="clipboard-button" aria-label="Clipboard" title="Clipboard"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5H6v16h12V5h-3M9 3h6v4H9zM9 11h6M9 15h6"/></svg></button>
      <button type="button" id="keyboard-button" aria-label="Keyboard" aria-pressed="false" title="Keyboard"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M7 15h10"/></svg></button>
    </div>
    <textarea id="keyboard-input" aria-label="Type on computer" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" tabindex="-1"></textarea>
    <dialog id="clipboard-dialog" aria-labelledby="clipboard-title">
      <header><strong id="clipboard-title">Clipboard</strong><button type="button" id="clipboard-close" aria-label="Close clipboard">×</button></header>
      <textarea id="clipboard-text" aria-label="Clipboard text" placeholder="Paste text here"></textarea>
      <footer><button type="button" id="clipboard-copy">Copy</button><button type="button" id="clipboard-paste">Paste to computer</button></footer>
    </dialog>
  </body>
</html>
