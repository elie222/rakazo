services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    # A Postgres 16 POSTGRES_IMAGE would ignore these mounts and open an empty database.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$PG_MAJOR" != 18 ]; then
          echo "POSTGRES_IMAGE must be Postgres 18, not $${PG_MAJOR:-unknown}" >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - postgres
    command: ["postgres"]
    environment:
      # USER/PASSWORD/DB apply only on first volume init. Keep existing values in
      # .env, or ALTER ROLE / rename in place. Recreate the volume only after backup
      # (or when it is disposable); down -v deletes all DB state.
      POSTGRES_USER: ${POSTGRES_USER:-rakazo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rakazo}
    volumes:
      # Postgres 18 keeps each major version's cluster in /var/lib/postgresql/<major>/docker.
      - postgres:/var/lib/postgresql
      # The Postgres 16 volume from earlier releases, read-only. While it holds data and no 18
      # cluster exists, the image refuses to start instead of creating an empty database; run
      # upgrade-postgres.sh (docs/self-host.md#upgrading-to-postgres-18).
      - pgdata:/var/lib/postgresql/16/docker:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakazo} -d ${POSTGRES_DB:-rakazo}"]
      interval: 3s
      timeout: 5s
      retries: 20

  supervisor:
    build:
      context: ../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
    environment:
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: rakazo/computer:local
      RAKAZO_COMPUTER_MEMORY: ${RAKAZO_COMPUTER_MEMORY:-2g}
      RAKAZO_COMPUTER_CPUS: ${RAKAZO_COMPUTER_CPUS:-2}
      RAKAZO_COMPUTER_PIDS_LIMIT: ${RAKAZO_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_TEAM_SCREEN_LIMIT: ${SANDBOX_TEAM_SCREEN_LIMIT:-0}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
      SANDBOX_COMPUTER_EGRESS: ${SANDBOX_COMPUTER_EGRESS:-auto}
      SANDBOX_COMPUTER_DNS: ${SANDBOX_COMPUTER_DNS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data:/data
    depends_on:
      computer:
        condition: service_completed_successfully

  computer:
    image: rakazo/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  data-init:
    image: ${BUSYBOX_IMAGE:-busybox:1}
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - ../../data:/data

  # Applies migrations as the database owner, creates the runtime login, and exits. Only this
  # container gets the owner login: the API and worker connect as rakazo_app, which row-level
  # security binds, so code running in either cannot find a login that bypasses it.
  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    working_dir: /app/apps/api
    command: ["pnpm", "db:deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-rakazo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    # Node runs directly, not through pnpm: pnpm does not pass SIGTERM on, so a stop would kill the
    # process before its graceful shutdown finishes in-flight requests and jobs.
    working_dir: /app/apps/api
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *app-environment
      # Sign-in, sessions, billing and inbound webhooks: API only.
      API_HOST: "0.0.0.0"
      API_PORT:
      BETTER_AUTH_SECRET:
      BETTER_AUTH_URL:
      WEB_ORIGIN:
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      AUTH_BREACHED_PASSWORD_CHECK_ENABLED: ${AUTH_BREACHED_PASSWORD_CHECK_ENABLED:-false}
      PASSKEY_APPLE_APP_IDS:
      PASSKEY_ANDROID_CERT_SHA256:
      # Proxies whose X-Forwarded-For is believed. Unset trusts this stack's own networks: the web
      # proxy and a reverse proxy on the host. See docs/self-host.md#client-addresses.
      TRUSTED_PROXIES:
      CLIENT_IP_HEADER:
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP_BYPASS: ${OIDC_ALLOW_SIGNUP_BYPASS:-false}
      SIGNUPS_ENABLED:
      SIGNUP_ALLOWLIST:
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      RAKAZO_DESKTOP_STACK_TOKEN:
      RAKAZO_GIT_SHA:
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      PRIVACY_POLICY_URL:
      EMAIL_PROVIDER:
      EMAIL_API_KEY:
      SMTP_URL:
      EMAIL_FROM:
      EMAIL_REPLY_TO:
      WELCOME_EMAIL_ENABLED:
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      STRIPE_PRICE_ID:
      CRISP_WEBSITE_ID:
      INTEGRATIONS_CATALOG_URL:
      TEAM_CHAT_BOT_ID:
      SLACK_RAKAZO_BOT_ID:
      TEAM_CHAT_JUDGE_PROVIDER:
      TEAM_CHAT_JUDGE_MODEL:
      SPACE_TEARDOWN_TIMEOUT_MS:
      RAKAZO_MIN_CLIENT_BUILD:
      RAKAZO_NAV_LINKS:
      RAKAZO_ADMIN_EMAILS:
      VOICE_SUMMARY_MIN_CHARS:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    # Directly, not through pnpm, so a stop reaches it (see the api command).
    working_dir: /app/apps/worker
    command: ["node", "--enable-source-maps", "dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    environment:
      <<: *app-environment
      GRAPHILE_WORKER_CONCURRENCY:
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      # Reached once migrations have run and the login the worker uses exists.
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    # Directly, not through pnpm, so a stop reaches it (see the api command).
    working_dir: /app/apps/web
    command: ["node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5173"]
    # Recent builds' hashed assets, so tabs still running one keep loading chunks after a deploy.
    volumes:
      - webassets:/app/apps/web/asset-archive
    environment:
      API_PROXY_TARGET: http://api:3100
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      RAKAZO_HOST: ${RAKAZO_HOST:-localhost}
      RAKAZO_CSP_SCRIPT_SRC: ${RAKAZO_CSP_SCRIPT_SRC:-}
      RAKAZO_CSP_CONNECT_SRC: ${RAKAZO_CSP_CONNECT_SRC:-}
      CRISP_WEBSITE_ID:
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres:
  pgdata:
  webassets:
