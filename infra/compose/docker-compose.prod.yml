  # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
  NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
  no_proxy: ${no_proxy:-${NO_PROXY:-}}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6}
    # A Postgres 16 POSTGRES_IMAGE would ignore these mounts and open an empty database.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$PG_MAJOR" != 18 ]; then
          echo "POSTGRES_IMAGE must be Postgres 18, not $${PG_MAJOR:-unknown}" >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - postgres
    command: ["postgres"]
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakazo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rakazo}
    volumes:
      # Postgres 18 keeps each major version's cluster in /var/lib/postgresql/<major>/docker.
      - postgres:/var/lib/postgresql
      # The Postgres 16 volume from earlier releases, read-only. While it holds data and no 18
      # cluster exists, the image refuses to start instead of creating an empty database; run
      # upgrade-postgres.sh (docs/self-host-upgrading.md#upgrading-to-postgres-18).
      - pgdata:/var/lib/postgresql/16/docker:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakazo} -d ${POSTGRES_DB:-rakazo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional point-in-time recovery (docs/self-host-backups.md#point-in-time-recovery). Postgres keeps no
  # egress: this sidecar streams WAL from it over `data` with a replication-only login and uploads
  # encrypted copies over its own `backup` network. infra/compose/pitr.sh enable turns it on.
  pitr:
    profiles: [pitr]
    # Tagged with a hash of Dockerfile.pitr and pitr-agent.sh, so a deploy builds it once per change
    # instead of on every run (compose-service.test.ts checks the hash).
    image: rakazo-pitr:aa7cf1bde2aa8051
    build:
      context: .
      dockerfile: Dockerfile.pitr
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6}
    restart: unless-stopped
    init: true
    logging: *logging
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    # Base backups compress on one core at most, leaving the rest to the app and database.
    cpus: 1
    environment:
      # Stops pg_receivewal and uploads with the container, not only the script.
      TINI_KILL_PROCESS_GROUP: "1"
      PGHOST: postgres
      PGUSER: rakazo_pitr
      PGDATABASE: postgres
      PGPASSWORD: ${PITR_DATABASE_PASSWORD:-}
      PITR_AGE_RECIPIENTS:
      PITR_BUCKET:
      PITR_ENDPOINT:
      PITR_REGION:
      PITR_ACCESS_KEY_ID:
      PITR_SECRET_ACCESS_KEY:
      PITR_PREFIX:
      PITR_PATH_STYLE:
      PITR_RETAIN_DAYS:
      PITR_MAX_WAL_GB:
    volumes:
      - pitrspool:/var/lib/rakazo-pitr
    tmpfs:
      - /tmp
    networks:
      - data
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rakazo-pitr", "health"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 2m

  # Applies migrations as the database owner, creates the runtime login, and exits. Only this
  # container gets the owner login: the API and worker connect as rakazo_app, which row-level
  # security binds, so code running in either cannot find a login that bypasses it.
  migrate:
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    working_dir: /app/apps/api
    command: ["pnpm", "db:deploy"]
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    environment:
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-rakazo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # The tag is what the updater moves. `docker compose pull` fetches it, `up -d` recreates onto
    # it, and the previous tag stays in .env so a rollback is one redeploy rather than a rebuild.
    #
    # The default tag is `local`, which no registry serves, so a fresh install builds from the
    # checkout via `up -d --build` instead of failing on a `pull` of an image that does not exist
    # yet. Once a release is published, pin RAKAZO_IMAGE_TAG to it and the pull path takes over.
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    # Node runs directly, not through pnpm: pnpm does not pass SIGTERM on, so a stop would kill the
    # process before its graceful shutdown finishes in-flight requests and jobs.
    working_dir: /app/apps/api
    command: ["node", "--enable-source-maps", "dist/index.js"]
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Chat runs execute in the API that receives them, so it gets the worker's headroom.
    pids_limit: 512
    mem_limit: ${RAKAZO_API_MEMORY_LIMIT:-2g}
    environment:
      <<: *app-environment
      # Sign-in, sessions, billing and inbound webhooks: API only.
      API_HOST: "0.0.0.0"
      API_PORT:
      BETTER_AUTH_SECRET:
      BETTER_AUTH_URL:
      WEB_ORIGIN:
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      AUTH_BREACHED_PASSWORD_CHECK_ENABLED: ${AUTH_BREACHED_PASSWORD_CHECK_ENABLED:-false}
      PASSKEY_APPLE_APP_IDS:
      PASSKEY_ANDROID_CERT_SHA256:
      # The hop in front of the API whose X-Forwarded-For is believed; see docs/self-host-production.md#client-addresses.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-caddy}
      CLIENT_IP_HEADER:
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP_BYPASS: ${OIDC_ALLOW_SIGNUP_BYPASS:-false}
      SIGNUPS_ENABLED:
      SIGNUP_ALLOWLIST:
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      RAKAZO_DESKTOP_STACK_TOKEN:
      RAKAZO_GIT_SHA:
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      PRIVACY_POLICY_URL:
      EMAIL_PROVIDER:
      EMAIL_API_KEY:
      SMTP_URL:
      EMAIL_FROM:
      EMAIL_REPLY_TO:
      WELCOME_EMAIL_ENABLED:
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      STRIPE_PRICE_ID:
      CRISP_WEBSITE_ID:
      INTEGRATIONS_CATALOG_URL:
      TEAM_CHAT_BOT_ID:
      SLACK_RAKAZO_BOT_ID:
      TEAM_CHAT_JUDGE_PROVIDER:
      TEAM_CHAT_JUDGE_MODEL:
      SPACE_TEARDOWN_TIMEOUT_MS:
      RAKAZO_MIN_CLIENT_BUILD:
      RAKAZO_NAV_LINKS:
      RAKAZO_ADMIN_EMAILS:
      VOICE_SUMMARY_MIN_CHARS:
    expose:
      - "3100"
    volumes:
      - appdata:/data
    networks:
      - app
      - data
      - control
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      # Probe every second while starting, so a deploy hands traffic over as soon as it can.
      start_period: 2m
      start_interval: 1s

  worker:
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    # Directly, not through pnpm, so a stop reaches it (see the api command).
    working_dir: /app/apps/worker
    command: ["node", "--enable-source-maps", "dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      # Probe every second while starting, so a deploy hands runs over as soon as it can.
      start_interval: 1s
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${RAKAZO_WORKER_MEMORY_LIMIT:-2g}
    environment:
      <<: *app-environment
      GRAPHILE_WORKER_CONCURRENCY:
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    # Directly, not through pnpm, so a stop reaches it (see the api command).
    working_dir: /app/apps/web
    command: ["node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5173"]
    # Recent builds' hashed assets, so tabs still running one keep loading chunks after a deploy.
    volumes:
      - webassets:/app/apps/web/asset-archive
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      NODE_ENV: production
      # vite preview bundles its config with Rolldown, which starts one thread per host CPU.
      # Keep that fixed so pids_limit holds on many-core hosts (#2430).
      RAYON_NUM_THREADS: "4"
      API_PROXY_TARGET: http://api:3100
      RAKAZO_HOST: ${RAKAZO_HOST:-app.example.com}
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      RAKAZO_CSP_SCRIPT_SRC: ${RAKAZO_CSP_SCRIPT_SRC:-}
      RAKAZO_CSP_CONNECT_SRC: ${RAKAZO_CSP_CONNECT_SRC:-}
      CRISP_WEBSITE_ID:
    expose:
      - "5173"
    networks:
      - edge
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 2m
      start_interval: 1s

  # The updater holds the Docker socket, which is root-equivalent on the host, so it is opt-in and
  # deliberately the narrowest service here: no `ports` (nothing on the host), only the dedicated
  # `control` network shared with the API, and no `env_file` — secrets stay in the bind-mounted
  # `.env` that Compose reads for interpolation, not in this process. Caddy has no route to it. The
  # API reaches it as http://updater:7092 with the shared token. It is also the one service the
  # update never recreates, because it is the process performing the update.
  updater:
    profiles: [updater]
    # Pinned separately from the application image: the updater does not recreate itself, so moving
    # its own version is an operator action, not something an update can do underneath itself.
    image: ${RAKAZO_UPDATER_IMAGE:-ghcr.io/elie222/rakazo/updater}:${RAKAZO_UPDATER_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/updater/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    init: true
    logging: *logging
    user: root
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    environment:
      NODE_ENV: production
      # Keep interpolation optional so deployments that do not enable this profile need no token.
      # resolveUpdaterConfig still refuses to start the sidecar without a dedicated secure value.
      RAKAZO_UPDATER_TOKEN: ${RAKAZO_UPDATER_TOKEN:-}
      RAKAZO_UPDATER_HOST: "0.0.0.0"
      RAKAZO_UPDATER_PORT: "7092"
      RAKAZO_IMAGE: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}
      # `-p` is available to Compose interpolation but is not injected into containers unless it is
      # declared here. The sidecar must target the project the operator actually started.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-rakazo-prod}
      # Must equal the host path it is mounted from, or every relative bind mount in this file would
      # resolve somewhere else. /srv/rakazo is the supported Linux production layout.
      RAKAZO_DEPLOY_DIR: ${RAKAZO_DEPLOY_DIR:-/srv/rakazo}
      # A deployment that layers an overlay has to be reconciled with the same file list and the
      # same services the operator runs by hand, so these are read from the environment rather
      # than pinned to the base stack. Defaults reproduce the previous behaviour exactly.
      RAKAZO_COMPOSE_FILE: ${RAKAZO_COMPOSE_FILE:-infra/compose/docker-compose.prod.yml}
      RAKAZO_UPDATE_SERVICES: ${RAKAZO_UPDATE_SERVICES:-}
      COMPOSE_PATH_SEPARATOR: ${COMPOSE_PATH_SEPARATOR:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RAKAZO_DEPLOY_DIR:-/srv/rakazo}:${RAKAZO_DEPLOY_DIR:-/srv/rakazo}
    networks:
      - control
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7092/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: ${CADDY_IMAGE:-caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d}
    restart: unless-stopped
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    environment:
      RAKAZO_HOST: ${RAKAZO_HOST:-app.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile.prod}:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - edge
      - app
    tmpfs:
      - /tmp
    depends_on:
      web:
        condition: service_started

volumes:
  postgres:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
  webassets:
  pitrspool:

networks:
  edge:
  app:
  control:
  data:
    internal: true
  backup:
