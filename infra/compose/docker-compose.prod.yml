name: rakazo-prod

# Bounded container logs even on hosts without infra/compose/docker-daemon.json;
# same driver and limits it installs, so both layers agree.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

# What the api and worker both read. Each service adds the keys only it reads, so a process
# only sees what it uses instead of the whole .env. A key with no value is passed through
# when .env (or the shell) sets it and left unset otherwise. Keep in sync with the code:
# infra/updater/src/compose-env.test.ts fails when a read is missing here or a key is unused.
x-app-environment: &app-environment
  # Runtime
  NODE_ENV: production
  # The app's own login, subject to row-level security (docs/self-host-configuration.md#database-roles).
  DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
  REALTIME_DATABASE_URL:
  DB_POOL_MAX:
  DATA_DIR: /data
  ENCRYPTION_KEY:
  ENCRYPTION_MASTER_KEYS:
  MASTER_KEY_PROVIDER:
  AWS_KMS_KEY_ARN:
  AWS_KMS_ACCESS_KEY_ID:
  AWS_KMS_SECRET_ACCESS_KEY:
  # on encrypts new content at rest; off stores it readable (docs/self-host-storage.md#content-encryption).
  CONTENT_ENCRYPTION: ${CONTENT_ENCRYPTION:-on}
  # Optional: keep computer homes and artifacts in S3-compatible storage (docs/self-host-storage.md#shared-storage-migration).
  OBJECT_STORAGE_BUCKET:
  OBJECT_STORAGE_ENDPOINT:
  OBJECT_STORAGE_REGION:
  OBJECT_STORAGE_ACCESS_KEY_ID:
  OBJECT_STORAGE_SECRET_ACCESS_KEY:
  OBJECT_STORAGE_PREFIX:
  OBJECT_STORAGE_PATH_STYLE:
