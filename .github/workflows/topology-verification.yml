name: manual topology verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    name: Production topology smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:topology
      - name: Replay computer tools against real Chromium without inference
        run: pnpm test:computer-replay --image=rakazo/computer:topology
