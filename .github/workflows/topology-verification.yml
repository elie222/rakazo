name: manual topology verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    name: Production topology smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:topology
      - name: Replay computer tools against real Chromium without inference
        run: pnpm test:computer-replay --image=rakazo/computer:topology
