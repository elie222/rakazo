name: Review bot

# Each PR gets one review bot for its whole life: even PR numbers go to
# CodeRabbit (label review:cr), odd ones to Qodo (label review:qodo). CodeRabbit
# reviews only labeled PRs (.coderabbit.yaml); Qodo reviews only when asked
# (.pr_agent.toml), so this workflow posts /agentic_review on open and on every
# push. When the assigned bot says it is rate limited or blocked, the PR moves
# to the other bot, unless that one has already said the same.
#
# pull_request_target and issue_comment so fork PRs get a reviewer; this
# workflow never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  assign:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'synchronize' &&
      !contains(github.event.pull_request.labels.*.name, 'review:cr') &&
      !contains(github.event.pull_request.labels.*.name, 'review:qodo')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if (( PR % 2 == 0 )); then
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=review:cr" --silent
          else
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=review:qodo" --silent
            gh pr comment "$PR" --repo "$REPO" --body "/agentic_review"
          fi

  rereview:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'review:qodo')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$REPO" --body "/agentic_review"

  handoff:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      ((github.event.comment.user.login == 'coderabbitai[bot]' &&
        contains(github.event.comment.body, 'rate limited by coderabbit.ai') &&
        contains(github.event.issue.labels.*.name, 'review:cr')) ||
       (startsWith(github.event.comment.user.login, 'qodo-') &&
        endsWith(github.event.comment.user.login, '[bot]') &&
        startsWith(github.event.comment.body, '<!-- qodo:') &&
        contains(github.event.issue.labels.*.name, 'review:qodo')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          FROM_BOT: ${{ github.event.comment.user.login }}
        run: |
          if [[ "$FROM_BOT" == "coderabbitai[bot]" ]]; then
            from=review:cr to=review:qodo
            blocked='(.user.login | startswith("qodo-") and endswith("[bot]")) and (.body | startswith("<!-- qodo:"))'
          else
            from=review:qodo to=review:cr
            blocked='.user.login == "coderabbitai[bot]" and (.body | contains("rate limited by coderabbit.ai"))'
          fi
          if [[ "$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "[.[] | select($blocked)] | length" |
                  awk '{ n += $1 } END { print n + 0 }')" != 0 ]]; then
            echo "Both review bots are blocked on this PR; leaving it with $from."
            exit 0
          fi
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/$from" --silent
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$to" --silent
          if [[ "$to" == review:qodo ]]; then
            gh pr comment "$PR" --repo "$REPO" --body "/agentic_review"
          fi
