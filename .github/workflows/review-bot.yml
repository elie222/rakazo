name: Review bot

# Greptile reviews PRs by default. The review:coderabbit label hands a PR to
# CodeRabbit when Greptile says "Reactivate Greptile", CODERABBIT_UNTIL holds
# a future date (YYYY-MM-DD), or Greptile stays silent for about 15 minutes.
# pull_request_target allows labeling fork PRs; no PR code is checked out or run.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event.review.user.login == 'greptile-apps[bot]' &&
        contains(github.event.review.body, 'Reactivate Greptile'))
    concurrency:
      group: review-bot-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Hand the PR to CodeRabbit when needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          UNTIL: ${{ vars.CODERABBIT_UNTIL }}
        run: |
          if [[ "$EVENT" == pull_request_review ]]; then
            reason='Greptile requested reactivation'
          elif [[ "$(date -u +%F)" < "$UNTIL" ]]; then
            reason='CODERABBIT_UNTIL is active'
          else
            sleep 900
            pr=$(gh api "repos/$REPO/pulls/$PR")
            if [[ $(jq -r '.state' <<< "$pr") != open ]]; then
              echo 'Skipping: PR is closed'
              exit 0
            fi
            if [[ $(jq -r '.draft' <<< "$pr") == true ]]; then
              echo 'Skipping: PR is a draft'
              exit 0
            fi
            if jq -e 'any(.labels[]; .name == "review:coderabbit")' <<< "$pr" > /dev/null; then
              echo 'Skipping: PR already uses CodeRabbit'
              exit 0
            fi
            engaged=$(
              for endpoint in "pulls/$PR/reviews" "issues/$PR/comments" "pulls/$PR/comments"; do
                gh api --paginate "repos/$REPO/$endpoint" \
                  --jq '.[] | select(.user.login == "greptile-apps[bot]") | .id'
              done
              gh api --paginate "repos/$REPO/commits/$(jq -r '.head.sha' <<< "$pr")/check-runs" \
                --jq '.check_runs[] | select(.app.slug // "" | test("greptile"; "i")) | .id'
            )
            if [[ -n "$engaged" ]]; then
              echo 'Skipping: Greptile has engaged with the PR'
              exit 0
            fi
            reason='Greptile has not engaged after 15 minutes'
          fi
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=review:coderabbit" --silent
          echo "Handed PR to CodeRabbit: $reason"
