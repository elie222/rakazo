name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Stable releases must validate and publish serially. Per-tag concurrency would let an older
  # release validate before a newer one publishes, then overwrite GitHub's "latest" pointer.
  group: release-desktop-stable
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      platforms: ${{ steps.platforms.outputs.include }}
      windows_signed: ${{ steps.platforms.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, ancestry, and monotonicity
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "Desktop releases must run from a tag, including manual dispatches." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Desktop releases use the stable vMAJOR.MINOR.PATCH channel." >&2
            exit 1
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match desktop version $version." >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The workflow revision does not match the tagged commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Desktop releases must point to a commit already on main." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi

          latest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' |
              sort -V |
              tail -n 1
          )"
          if [[ -n "$latest_tag" ]]; then
            highest="$(printf '%s\n%s\n' "$latest_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
            if [[ "$highest" != "$RELEASE_TAG" || "$latest_tag" == "$RELEASE_TAG" ]]; then
              echo "$RELEASE_TAG must be newer than published release $latest_tag." >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - name: Choose release platforms
        id: platforms
        env:
          # Windows ships unsigned until Azure Artifact Signing is configured.
          WINDOWS_SIGNING: ${{ secrets.DESKTOP_WIN_AZURE_CLIENT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          include='[{"os":"macos-26","artifact":"macos"},{"os":"ubuntu-24.04","artifact":"linux"},{"os":"windows-2022","artifact":"windows"}]'
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "windows_signed=$WINDOWS_SIGNING" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }} artifacts
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Azure trusts GitHub OIDC tokens only from this environment, so Windows signing needs no stored secret.
    environment: desktop-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.platforms) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Generate the database client for desktop compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_P8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
      - name: Prepare system passkey association
        id: passkeys
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Optional: without it the release still ships and hides passkeys on macOS.
          PROVISIONING_PROFILE: ${{ secrets.DESKTOP_MAC_PROVISIONING_PROFILE }}
          PROFILE_PATH: ${{ runner.temp }}/rakazo.provisionprofile
          ENTITLEMENTS_PATH: ${{ runner.temp }}/entitlements.passkeys.plist
        run: |
          set -euo pipefail
          if [[ -z "$PROVISIONING_PROFILE" ]]; then
            echo "::notice::Building without system passkeys; DESKTOP_MAC_PROVISIONING_PROFILE is not set."
            exit 0
          fi
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          profile="$(mktemp)"
          security cms -D -i "$PROFILE_PATH" > "$profile"
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" "$profile" > /dev/null 2>&1; then
            echo "::error::The provisioning profile's App ID lacks the Associated Domains capability."
            exit 1
          fi
          APPLE_TEAM_ID="$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$profile")"
          app_id="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$profile")"
          bundle_id="$(node -p "require('./apps/desktop/package.json').build.appId")"
          rm -f "$profile"
          # macOS refuses to launch an app whose entitlements its profile does not authorize.
          if [[ "$app_id" != "$APPLE_TEAM_ID.$bundle_id" ]]; then
            echo "::error::The provisioning profile is not for $bundle_id."
            exit 1
          fi
          APPLE_TEAM_ID="$APPLE_TEAM_ID" pnpm exec tsx apps/desktop/scripts/passkey-entitlements.ts > "$ENTITLEMENTS_PATH"
          plutil -lint "$ENTITLEMENTS_PATH"
          echo "profile=$PROFILE_PATH" >> "$GITHUB_OUTPUT"
          echo "entitlements=$ENTITLEMENTS_PATH" >> "$GITHUB_OUTPUT"
      - name: Package signed and notarized universal macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          PASSKEY_PROFILE: ${{ steps.passkeys.outputs.profile }}
          PASSKEY_ENTITLEMENTS: ${{ steps.passkeys.outputs.entitlements }}
        run: |
          set -eo pipefail
          passkeys=()
          if [[ -n "$PASSKEY_ENTITLEMENTS" ]]; then
            # The main app alone gets the association; helpers keep entitlementsInherit.
            passkeys=("-c.mac.entitlements=$PASSKEY_ENTITLEMENTS" "-c.mac.provisioningProfile=$PASSKEY_PROFILE")
          fi
          pnpm --filter @rakazo/desktop exec electron-builder \
            --mac --universal --publish never -c.forceCodeSigning=true "${passkeys[@]}"
      - name: Remove the App Store Connect API key from the runner
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: rm -f "$APPLE_API_KEY"
      - name: Verify macOS signature, notarization ticket, and update feed
        if: runner.os == 'macOS'
        shell: bash
        env:
          PASSKEY_ENTITLEMENTS: ${{ steps.passkeys.outputs.entitlements }}
        run: |
          set -euo pipefail
          app="apps/desktop/out/mac-universal/Rakazo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Without this entitlement the hardened runtime silences the microphone.
          # Check the app and every helper it signs, and require the value to be true.
          entitlements="$(mktemp)"
          while IFS= read -r -d '' bundle; do
            codesign -d --entitlements :- "$bundle" > "$entitlements" 2>/dev/null
            mic="$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.device.audio-input" "$entitlements" 2>/dev/null || true)"
            if [ "$mic" != "true" ]; then
              echo "::error::$bundle is missing the microphone entitlement"
              exit 1
            fi
          done < <(find "$app" -type d -name "*.app" -print0)
          if [[ -n "$PASSKEY_ENTITLEMENTS" ]]; then
            # The signed app must carry exactly the generated association and its profile.
            codesign -d --entitlements :- "$app" > "$entitlements" 2>/dev/null
            for key in com.apple.application-identifier com.apple.developer.associated-domains; do
              expected="$(/usr/libexec/PlistBuddy -c "Print :$key" "$PASSKEY_ENTITLEMENTS")"
              actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$entitlements" 2>/dev/null || true)"
              if [[ "$actual" != "$expected" ]]; then
                echo "::error::$app is missing the $key passkey entitlement"
                exit 1
              fi
            done
            test -f "$app/Contents/embedded.provisionprofile"
          fi
          rm -f "$entitlements"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          grep -Fqx "provider: github" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "owner: elie222" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "repo: rakazo" "$app/Contents/Resources/app-update.yml"

      - name: Verify packaged native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="apps/desktop/out/mac-universal/Rakazo.app"
          native="$app/Contents/Resources/app.asar.unpacked/node_modules"
          lipo "$native/@koromix/koffi-darwin-x64/darwin_x64/koffi.node" -verify_arch x86_64
          lipo "$native/@koromix/koffi-darwin-arm64/darwin_arm64/koffi.node" -verify_arch arm64
          lipo "$native/@oxc-parser/binding-darwin-x64/parser.darwin-x64.node" -verify_arch x86_64
          lipo "$native/@oxc-parser/binding-darwin-arm64/parser.darwin-arm64.node" -verify_arch arm64
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Rakazo" -e '
            const { createRequire } = require("node:module");
            const appRequire = createRequire(`${process.argv[1]}/Contents/Resources/app.asar/package.json`);
            const koffi = appRequire("koffi");
            if (koffi.load(null).func("int getpid()")() !== process.pid) {
              throw new Error("Packaged native bridge dependency failed");
            }
            const native = `${process.argv[1]}/Contents/Resources/app.asar.unpacked/node_modules`;
            const parser = appRequire(`${native}/@oxc-parser/binding-darwin-${process.arch}/parser.darwin-${process.arch}.node`);
            if (parser.parseSync("smoke.js", "const ready = true;").errors.length !== 0) {
              throw new Error("Packaged monitoring parser dependency failed");
            }
          ' "$PWD/$app"

      - name: Require Windows signing credentials
        if: runner.os == 'Windows' && needs.validate.outputs.windows_signed == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.DESKTOP_WIN_AZURE_TENANT_ID }}
          SIGNING_ENDPOINT: ${{ vars.DESKTOP_WIN_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.DESKTOP_WIN_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.DESKTOP_WIN_SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.DESKTOP_WIN_PUBLISHER }}
        run: |
          set -euo pipefail
          test -n "$AZURE_TENANT_ID"
          test -n "$SIGNING_ENDPOINT"
          test -n "$SIGNING_ACCOUNT"
          test -n "$SIGNING_PROFILE"
          test -n "$SIGNING_PUBLISHER"
      - name: Log in to Azure for Windows signing
        if: runner.os == 'Windows' && needs.validate.outputs.windows_signed == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.DESKTOP_WIN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DESKTOP_WIN_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Package signed x64 Windows app
        if: runner.os == 'Windows' && needs.validate.outputs.windows_signed == 'true'
        shell: bash
        env:
          SIGNING_ENDPOINT: ${{ vars.DESKTOP_WIN_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.DESKTOP_WIN_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.DESKTOP_WIN_SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.DESKTOP_WIN_PUBLISHER }}
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/desktop exec electron-builder \
            --win --x64 --publish never -c.forceCodeSigning=true \
            "-c.win.azureSignOptions.endpoint=$SIGNING_ENDPOINT" \
            "-c.win.azureSignOptions.codeSigningAccountName=$SIGNING_ACCOUNT" \
            "-c.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE" \
            "-c.win.azureSignOptions.publisherName=$SIGNING_PUBLISHER"
      - name: Package unsigned x64 Windows app
        if: runner.os == 'Windows' && needs.validate.outputs.windows_signed != 'true'
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --win --x64 --publish never
      - name: Verify Windows Authenticode signature and publisher-bound update feed
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNED: ${{ needs.validate.outputs.windows_signed }}
          SIGNING_PUBLISHER: ${{ vars.DESKTOP_WIN_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          $executables = @(
            Get-ChildItem "apps/desktop/out/*.exe"
            Get-ChildItem "apps/desktop/out/win-unpacked/*.exe"
          )
          if ($executables.Count -lt 2) { throw "Windows installer or application was not created." }
          $config = "apps/desktop/out/win-unpacked/resources/app-update.yml"
          $feed = Get-Content -Raw $config
          foreach ($expected in @("provider: github", "owner: elie222", "repo: rakazo")) {
            if ($feed -notmatch "(?m)^$([regex]::Escape($expected))\r?$") {
              throw "Windows update config missing '$expected'."
            }
          }
          if ($env:SIGNED -ne "true") {
            # Unsigned builds must not name a publisher, or they would reject the first signed update.
            if ($feed -match "(?m)^publisherName:") { throw "Unsigned Windows update config names a publisher." }
            exit 0
          }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($executable.Name) signature is $($signature.Status)."
            }
            # Artifact Signing certificates last days; only a timestamp keeps the signature valid after that.
            if (-not $signature.TimeStamperCertificate) { throw "$($executable.Name) is not timestamped." }
            if ($signature.SignerCertificate.GetNameInfo("SimpleName", $false) -ne $env:SIGNING_PUBLISHER) {
              throw "$($executable.Name) is not signed by the configured publisher."
            }
          }
          pnpm exec tsx apps/desktop/scripts/verify-update-publisher.ts $config $env:SIGNING_PUBLISHER
          if ($LASTEXITCODE -ne 0) { throw "Windows update config is not bound to the signing publisher." }

      - name: Package x64 Linux AppImage
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --linux --x64 --publish never
      - name: Verify Linux update feed is pinned to the official GitHub channel
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          config="apps/desktop/out/linux-unpacked/resources/app-update.yml"
          if [[ ! -f "$config" ]]; then
            config="$(find apps/desktop/out -name app-update.yml -print -quit)"
          fi
          test -n "$config"
          test -f "$config"
          grep -Fqx "provider: github" "$config"
          grep -Fqx "owner: elie222" "$config"
          grep -Fqx "repo: rakazo" "$config"
          test -f apps/desktop/out/latest-linux.yml
          grep -Fqx "version: $RELEASE_VERSION" apps/desktop/out/latest-linux.yml

      - name: Retain installers and updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.artifact }}-${{ needs.validate.outputs.sha }}
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.blockmap
            apps/desktop/out/*.dmg
            apps/desktop/out/*.exe
            apps/desktop/out/latest*.yml
            apps/desktop/out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attest and publish complete release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*-${{ needs.validate.outputs.sha }}
          path: release-artifacts
          merge-multiple: true
      - name: Verify the complete stable update feed
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "The release tag moved after the build started." >&2
            exit 1
          fi

          test -f release-artifacts/latest-mac.yml
          test -f release-artifacts/latest-linux.yml
          compgen -G 'release-artifacts/*.dmg' >/dev/null
          compgen -G 'release-artifacts/*.zip' >/dev/null
          compgen -G 'release-artifacts/*.AppImage' >/dev/null
          test -f release-artifacts/latest.yml
          compgen -G 'release-artifacts/*.exe' >/dev/null
          feeds=(
            release-artifacts/latest-mac.yml
            release-artifacts/latest-linux.yml
            release-artifacts/latest.yml
          )
          for feed in "${feeds[@]}"; do
            grep -Fqx "version: $RELEASE_VERSION" "$feed"
          done

          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*
      - name: Create draft and upload every platform
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release-artifacts/*
          --draft --generate-notes --title "Rakazo $RELEASE_TAG" --verify-tag
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove an incomplete draft
        if: failure() && steps.create_release.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft 2>/dev/null)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
