name: preview-cleanup

# Deletes a pull request's preview when it closes, and sweeps daily for any a missed event left.
# pull_request_target runs this file from the base branch with secrets; it never checks out the
# pull request, and uses only its number.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number || 'sweep' }}

jobs:
  cleanup:
    name: Delete previews
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
      FLY_ORG: ${{ vars.FLY_PREVIEW_ORG }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      APP_PREFIX: ${{ vars.FLY_PREVIEW_APP_PREFIX }}
    steps:
      - name: Check configuration
        id: configured
        run: |
          if [[ -n $FLY_API_TOKEN ]]; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.configured.outputs.yes
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.configured.outputs.yes
        with:
          version: 0.4.97
      - name: Delete
        if: steps.configured.outputs.yes
        run: bash infra/preview/cleanup.sh
