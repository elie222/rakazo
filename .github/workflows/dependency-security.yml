name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      # pnpm reads its own multi-document lockfile. No dependency installation or lifecycle
      # scripts are needed. Include build/release dependencies as well as production ones.
      - name: Audit workspace dependencies
        run: |
          pnpm audit --audit-level high --json > dependency-audit.json
          node scripts/check-dependency-audit.mjs dependency-audit.json
      - name: Retain complete audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  published-images:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [app, computer, updater]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trivy
      - name: Scan published image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/${{ matrix.image }}:edge
          IMAGE_PLATFORM: linux/${{ matrix.arch }}
        run: |
          trivy image --image-src remote --platform "$IMAGE_PLATFORM" --scanners vuln --format json --output image-vulnerabilities.json "$IMAGE_REF"
          trivy version --format json > scanner-version.json
          trivy convert --format cyclonedx --output image-sbom.json image-vulnerabilities.json
      - name: Retain image security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-security-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            image-vulnerabilities.json
            scanner-version.json
            image-sbom.json
          if-no-files-found: warn
