name: nightly verification

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      run_live_providers:
        description: Run secret-gated OpenRouter, E2B, and Box canaries
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-verification
  cancel-in-progress: false

jobs:
  visual-web:
    name: Daily web screenshots
    uses: ./.github/workflows/playwright.yml
    with:
      publish_report: true
    secrets:
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

  topology:
    name: Production topology smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:topology
      - name: Replay computer tools against real Chromium without inference
        run: pnpm test:computer-replay --image=rakazo/computer:topology

  live-providers:
    name: Live provider canaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      BOX_API_KEY: ${{ secrets.BOX_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RUN_LIVE_PROVIDERS: ${{ github.event_name == 'schedule' || inputs.run_live_providers }}
    steps:
      - name: Check secret-gated canaries
        id: gate
        shell: bash
        run: |
          if [[ "$RUN_LIVE_PROVIDERS" == "true" && ( -n "$E2B_API_KEY" || -n "$BOX_API_KEY" || -n "$OPENROUTER_API_KEY" ) ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No requested live canary has a configured key; skipping safely."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm test:canary

  agent-evals:
    name: Agent quality baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PI_DEFAULT_MODEL: ${{ vars.PI_DEFAULT_MODEL || 'deepseek/deepseek-v4-flash-0731' }}
      RUN_LIVE_PROVIDERS: ${{ github.event_name == 'schedule' || inputs.run_live_providers }}
    steps:
      - name: Check live eval prerequisites
        id: gate
        shell: bash
        env:
          MODEL_CONNECTION_JSON: ${{ secrets.MODEL_CONNECTION_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ "$RUN_LIVE_PROVIDERS" == "true" && ( -n "$MODEL_CONNECTION_JSON" || -n "$OPENROUTER_API_KEY" ) ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Agent quality evals: not run (live inference not requested or credential unavailable)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Measure real-agent task success
        if: steps.gate.outputs.enabled == 'true'
        env:
          MODEL_CONNECTION_JSON: ${{ secrets.MODEL_CONNECTION_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$MODEL_CONNECTION_JSON" ]]; then
            connection_file="$(mktemp)"
            trap 'rm -f "$connection_file"' EXIT
            printf '%s' "$MODEL_CONNECTION_JSON" > "$connection_file"
            pnpm test:evals --live --connection "$connection_file" --trials 3
          else
            pnpm test:evals --live --provider openrouter --model "$PI_DEFAULT_MODEL" --api-key-env OPENROUTER_API_KEY --trials 3
          fi
      - name: Upload redacted eval evidence
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-eval-results
          path: test-report/evals
          if-no-files-found: warn
          retention-days: 14
