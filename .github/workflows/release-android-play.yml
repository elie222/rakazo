name: release-android-play

# Builds the production Android App Bundle on EAS and publishes it to Google Play's production
# track as a full rollout. Pass build_id to publish a finished EAS build instead of building.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Finished EAS production build to publish (leave empty to build from main)
        required: false
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-android-play
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish to Google Play
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require release secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          missing=()
          for name in EXPO_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Add these repository secrets (see docs/mobile-release.md): ${missing[*]}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Set up Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        run: pnpm --filter @rakazo/mobile check

      - name: Build App Bundle on EAS
        id: build
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_ID" ]]; then
            eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
            jq -e '.status == "FINISHED" and .platform == "ANDROID" and .buildProfile == "production"' \
              "$RUNNER_TEMP/build.json" > /dev/null || {
              echo "Build $BUILD_ID is not a finished Android production build." >&2
              exit 1
            }
            echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          else
            eas build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
            echo "id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")" >> "$GITHUB_OUTPUT"
          fi

      # The key stays out of the public eas.json; it is written to a temporary file for this upload.
      - name: Publish to Google Play
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/google-play-service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > "$key"
          jq --arg key "$key" \
            '.submit.production.android = {serviceAccountKeyPath: $key, track: "production", releaseStatus: "completed"}' \
            eas.json > "$RUNNER_TEMP/eas.json"
          cp "$RUNNER_TEMP/eas.json" eas.json
          eas submit --platform android --profile production --id "$BUILD_ID" --non-interactive --wait
