name: publish-server-image

# Release tags publish the source-addressed image used by in-app updates plus the human-readable
# semver tags. Main commits publish `sha-<commit>` and `edge` through ci.yml, which calls this
# workflow so a production deploy starts only once its image exists. Pull requests build with a
# read-only token and an isolated cache, so untrusted code can validate the images without
# receiving package-publish authority.
#
# Published builds run on Depot when the DEPOT_PROJECT_ID repository variable names a project, and
# on GitHub's runners otherwise (forks) or when a Depot build fails. Pull requests never use Depot.
on:
  push:
    tags: ["v*"]
  workflow_call:
  # Only what the image definitions consume directly. A source change that breaks the app's build
  # fails ci.yml's production builds first, and main still builds every image before it deploys.
  pull_request:
    paths:
      - ".dockerignore"
      - ".npmrc"
      - ".github/workflows/publish-server-image.yml"
      - ".github/actions/publish-image/**"
      - "infra/compose/**"
      - "infra/sandboxes/**"
      - "infra/updater/**"
      - "patches/**"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # docker/metadata-action otherwise truncates commit tags to seven collision-prone characters.
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40

concurrency:
  group: publish-server-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer-smoke:
    name: Compose installer smokes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: bash infra/compose/run-smokes.sh

  validate:
    name: Validate ${{ matrix.name }} image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
            context: .
          - name: updater
            dockerfile: infra/updater/Dockerfile
            context: .
          - name: computer
            dockerfile: infra/sandboxes/computer/Dockerfile
            context: infra/sandboxes/computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.name == 'app' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: |
            type=gha,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.name }}
            type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.name }}
          provenance: false
          sbom: false

  build:
    name: Build ${{ matrix.name }} ${{ matrix.arch }}
    # A Depot outage must not block deploys, so any failed Depot build rebuilds every image here.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      (vars.DEPOT_PROJECT_ID == '' || contains(needs.build-depot.outputs.*, 'failed'))
    needs: [build-depot]
    # Each architecture builds natively on its own runner and pushes by digest only.
    # No QEMU: GitHub hosts native arm64 runners, and emulated arm64 took hours for the
    # desktop-sized computer image. See docs/self-host-upgrading.md (Published images and tags).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [app, updater, computer]
        arch: [amd64, arm64]
        include:
          # Only the updater image contains the Docker CLI; the application image stays unprivileged.
          # The supervisor is not a separate published image: it runs from `app` on the internal network.
          - name: app
            dockerfile: infra/compose/Dockerfile
            context: .
          - name: updater
            dockerfile: infra/updater/Dockerfile
            context: .
          - name: computer
            dockerfile: infra/sandboxes/computer/Dockerfile
            context: infra/sandboxes/computer
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # Labels only; publication applies tags after validation.
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # A fork can publish only to its own namespace; no credential can redirect this value.
          # The app's filesystem is also written locally so the credential scan needs no registry pull.
          outputs: |
            type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
            ${{ matrix.name == 'app' && 'type=tar,dest=/tmp/rootfs.tar' || '' }}
          # GET /health can report the exact source commit without a deployment-supplied override.
          build-args: ${{ matrix.name == 'app' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      # Before any tag points at it: the untagged digest is unreachable without this run's output.
      - name: Check the app image ships no credentials
        if: matrix.name == 'app'
        run: bash infra/compose/check-image.sh /tmp/rootfs.tar
      - name: Record the architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-depot:
    name: Build ${{ matrix.name }} on Depot
    if: github.event_name != 'pull_request' && vars.DEPOT_PROJECT_ID != ''
    # Each Depot image is checked, tagged, and attested in this job without a second runner.
    # Per-image locks bound builds and protect moving tags while other CI runs independently.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Depot authenticates the build with the workflow's OIDC token; no Depot secret exists.
      id-token: write
      attestations: write
    # Each image reports its own key; the fallback build reads them all.
    outputs:
      app: ${{ steps.depot.outputs.app }}
      updater: ${{ steps.depot.outputs.updater }}
      computer: ${{ steps.depot.outputs.computer }}
    concurrency:
      group: publish-image-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
            context: .
          - name: updater
            dockerfile: infra/updater/Dockerfile
            context: .
          - name: computer
            dockerfile: infra/sandboxes/computer/Dockerfile
            context: infra/sandboxes/computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # Labels only; publication applies tags after validation.
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: type=sha,prefix=sha-
      - id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        continue-on-error: true
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          # A fork can publish only to its own namespace; no credential can redirect this value.
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.name == 'app' && format('GIT_SHA={0}', github.sha) || '' }}
          provenance: mode=max
          sbom: true
      - id: depot
        env:
          IMAGE: ${{ matrix.name }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          [[ "$OUTCOME" == success ]] || echo "::warning::Depot could not build ${IMAGE}; building on GitHub's runners instead."
          echo "${IMAGE}=$([[ "$OUTCOME" == success ]] && echo built || echo failed)" >> "$GITHUB_OUTPUT"
      - name: Check the app image ships no credentials
        if: matrix.name == 'app' && steps.build.outcome == 'success'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/app@${{ steps.build.outputs.digest }}
        # Exporting a filesystem needs no emulation, so one runner checks both platforms.
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            bash infra/compose/check-image.sh "$IMAGE" "$platform"
          done
      - name: Record the image digest
        if: steps.build.outcome == 'success'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          IMAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "Depot reported no image digest." >&2; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "Built ${IMAGE} on Depot (build ${BUILD_ID}): ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.build.outcome == 'success'
        uses: ./.github/actions/publish-image
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          digests-directory: /tmp/digests

  publish:
    name: Publish ${{ matrix.name }} image
    # Native GitHub builds still need to combine their two architecture artifacts.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: publish-image-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
          - name: updater
          - name: computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-image
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          digests-directory: /tmp/digests
