name: publish-server-image
# Two triggers, because the updater serves two audiences from one registry:
#
#   * release tags produce the `vX.Y.Z` images that in-app "update to latest release" resolves to,
#     plus the moving `latest`. This is the only path a stock deployment ever follows.
#   * pushes to main produce `edge` and an immutable `sha-<commit>`, which is what makes an update
#     traceable: the tag a deployment is pinned to names the exact commit it is running, and the
#     previous tag is still pullable for a rollback.
#
# Pull requests build without pushing, so a broken Dockerfile fails review rather than the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "infra/compose/Dockerfile"
      - "infra/updater/**"
      - ".github/workflows/publish-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The application image runs api, worker, and web; the updater is separate so that only
          # one container ever carries the Docker CLI alongside the Docker socket.
          - name: app
            dockerfile: infra/compose/Dockerfile
          - name: updater
            dockerfile: infra/updater/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked in so `GET /health` reports the commit the running image was built from, without
          # the deployment having to supply GIT_SHA. An update that moves the tag also moves this.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
