name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR checks cancel together. On main, each job that leads to a deploy holds a per-job
# lock: one revision runs while only the newest waits, so a burst of merges deploys its last commit
# without stopping work already in progress. Main reruns only what the deploy needs; the pull
# request already ran the rest against the then-current main, and the nightly run refreshes the
# E2E screenshot baseline.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Testcontainers pulls Docker Hub images through Google's public mirror: anonymous Docker Hub pulls
# from shared runner IPs fail intermittently with "authentication required" or rate limits.
env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

jobs:
  # Pull requests skip suites their files cannot affect (see .github/scripts/changed-areas.sh). A
  # suite gated here never takes a runner, and a job skipped by `if` still satisfies a required
  # check. Gates read `!= 'false'`, so main (which skips this job) and a failed classification run
  # everything.
  changes:
    name: Changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.areas.outputs.server }}
      native: ${{ steps.areas.outputs.native }}
      compose: ${{ steps.areas.outputs.compose }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      www: ${{ steps.areas.outputs.www }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The merge commit's first parent is the base, so this diff is exactly what the PR adds.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
      - id: areas
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"

  # A marketing-site or docs change builds only the site.
  build:
    name: Production builds
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      (needs.changes.outputs.web != 'false' || needs.changes.outputs.www != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB: ${{ needs.changes.outputs.web != 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          electron: ${{ env.WEB }}
          turbo: build
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build the marketing site
        if: env.WEB != 'true'
        run: pnpm exec turbo build --filter=@rakazo/www
      # The size budgets read the bundles this step just built, in a fraction of a second.
      - run: pnpm build && node scripts/checks/bundle-size.mjs
        if: env.WEB == 'true'
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
          BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - name: Save turbo build cache
        if: success() && env.WEB == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Electron smoke
        if: env.WEB == 'true'
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: xvfb-run --auto-servernum pnpm --filter @rakazo/desktop exec playwright test --config e2e/playwright.config.ts
      - name: Upload desktop setup screenshots
        if: always() && env.WEB == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-screenshots
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore

  # A deploy needs these jobs, so like Postgres journeys they check their own changed areas to reach
  # their main locks in push order. Pull requests typecheck and test only the packages their files
  # touch and the packages that depend on them, unless a change sits outside the package graph;
  # main always runs everything.
  static-checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-checks-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-workspace
        with:
          turbo: ${{ github.event_name == 'pull_request' && 'check' || 'none' }}
      - name: Lint
        if: github.event_name == 'pull_request'
        run: pnpm lint
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Typecheck
        if: steps.areas.outputs.all_packages != 'false'
        run: pnpm check
      - name: Typecheck affected packages
        if: steps.areas.outputs.all_packages == 'false'
        run: pnpm check --affected
        env:
          TURBO_SCM_BASE: HEAD^1
      - name: Save typecheck cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-check-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Host operations safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 infra/compose/host-safeguards.test.py
      - name: Preview startup tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 infra/preview/start.test.py
      - name: Codex subscription auth safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/codex-subscription-auth.test.py
      - name: Dependency update patch safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/dependency-update-patch.test.py
      - name: Issue triage labeling tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/apply-issue-triage.test.py
      - name: PR screenshot section tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/pr-screenshots.test.py
      - name: Changed-area classification tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/changed-areas.test.py
      - name: Mobile OTA base selection tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/ota-base.test.py
      - name: App Store review submission tests
        if: steps.areas.outputs.all_packages != 'false'
        run: node --test .github/scripts/app-store-review.test.mjs
      - name: Script tests
        run: node --test scripts/lazy-vendors.test.mjs scripts/checks/*.test.mjs scripts/release/*.test.mjs scripts/exploratory-qa/*.test.mjs

  # Four runners finish the unit suite before the Web E2E shards, which set the pull request's
  # finish time; more runners only add per-job setup and queue for the account's runner limit. A
  # shard the classification leaves out stops after checkout.
  unit-tests-shard:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 20
    concurrency:
      group: ci-unit-${{ matrix.shard }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - id: unit
        env:
          SHARDS: ${{ steps.areas.outputs.unit_shards || '[1,2,3,4]' }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "run=$(jq --argjson shard "$SHARD" 'index($shard) != null' <<<"$SHARDS")" >> "$GITHUB_OUTPUT"
          # A single selected shard runs every test itself rather than a quarter of them.
          echo "whole=$(jq 'length == 1' <<<"$SHARDS")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-workspace
        if: steps.unit.outputs.run == 'true'
      - run: pnpm db:generate
        if: steps.unit.outputs.run == 'true'
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Install age for the encrypted backup round trip
        if: steps.unit.outputs.run == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
      - name: Unit tests
        if: steps.unit.outputs.run == 'true' && steps.areas.outputs.all_packages != 'false'
        env:
          WHOLE: ${{ steps.unit.outputs.whole }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$WHOLE" == true ]]; then pnpm run test; else pnpm run test --shard="$SHARD/4"; fi
      - name: Unit tests for affected packages
        if: steps.unit.outputs.run == 'true' && steps.areas.outputs.all_packages == 'false'
        env:
          TURBO_SCM_BASE: HEAD^1
          WHOLE: ${{ steps.unit.outputs.whole }}
        run: |
          affected="$(pnpm exec turbo ls --affected --output=json | jq -r '.packages.items[].path + "/"')"
          mapfile -t packages < <(printf "%s" "$affected")
          # These read other packages' files without importing them, so the package graph misses them.
          targets=("${packages[@]}" \
            .agents/skills/translate/catalog-gaps.test.ts \
            infra/updater/src/compose-env.test.ts \
            packages/adapters/src/builtin-skills.test.ts \
            packages/adapters/src/providers/messaging/lark/lark-lazy-loading.test.ts \
            packages/page-kit/src/kit/labels.test.tsx \
            packages/testkit/src/eas-pnpm-version.test.ts \
            packages/testkit/src/ios-screenshot-catalog.test.ts)
          # Vitest rejects more shards than test files, so a small set runs whole on the first shard.
          files="$(pnpm exec vitest list --filesOnly "${targets[@]}" | grep -c '\.test\.' || true)"
          if [[ "$WHOLE" == true ]] || (( files < 4 )); then
            (( ${{ matrix.shard }} == 1 )) || exit 0
            pnpm exec vitest run "${targets[@]}"
          else
            pnpm exec vitest run "${targets[@]}" --shard=${{ matrix.shard }}/4
          fi

  # The required check and the deploy gate, under one stable name.
  checks:
    name: Checks
    needs: [static-checks, unit-tests-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.static-checks.result }}" = success && test "${{ needs.unit-tests-shard.result }}" = success

  # Desktop + its workspace deps only. A full-workspace install on Windows also links supervisor
  # (dockerode → cpu-features) and spends about a minute on a node-gyp rebuild that fails without
  # Visual Studio and is unused by these tests. Electron's binary is cached separately from the
  # pnpm store.
  native-computer:
    name: Native computer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Windows pnpm launcher test
        if: runner.os == 'Windows'
        run: node --test scripts/pnpm.test.mjs
      - name: Worktree environment setup test
        run: node --test scripts/setup-worktree.test.mjs
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          filter: "@rakazo/desktop..."
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: pnpm --filter @rakazo/desktop build
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: pnpm exec vitest run packages/adapters/src/host-computer.test.ts packages/adapters/src/file-handle-path.test.ts packages/adapters/src/providers/computer/desktop/desktop-sandbox-command.test.ts packages/adapters/src/providers/computer/desktop/desktop-sandbox-paths.test.ts packages/adapters/src/providers/computer/desktop/desktop-workspace-cleanup.test.ts packages/adapters/src/computer-support.test.ts apps/desktop/src/main/host-computer.test.ts
      - name: Screen control on a real Windows desktop
        if: runner.os == 'Windows'
        run: pnpm exec vitest run apps/desktop/src/main/host-screen.windows.test.ts
      - name: Native computer in headless Electron
        run: pnpm --filter @rakazo/desktop exec electron ../../node_modules/vitest/vitest.mjs run --root ../.. packages/adapters/src/host-computer.test.ts apps/desktop/src/main/host-computer.test.ts
        env:
          ELECTRON_RUN_AS_NODE: "1"
          electron_config_cache: ${{ runner.temp }}/electron-cache

  # Checks its own changed areas instead of needing `changes`: a deploy needs this job, and on main
  # it must reach its lock in push order so an older revision cannot replace a newer waiting one.
  # Four runners finish the suites before the Web E2E shards, which set the pull request's finish
  # time; more runners only add per-job setup and queue for the account's runner limit.
  test-integration-shard:
    name: Postgres journeys (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-postgres-${{ matrix.shard }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - name: Start Postgres
        if: steps.areas.outputs.server != 'false'
        uses: ./.github/actions/start-postgres
      - uses: ./.github/actions/setup-workspace
        if: steps.areas.outputs.server != 'false'
      - name: Wait for Postgres
        if: steps.areas.outputs.server != 'false'
        run: bash .github/actions/start-postgres/wait.sh
      - run: pnpm test:integration --shard=${{ matrix.shard }}/4
        if: steps.areas.outputs.server != 'false'

  # The required check and the deploy gate, under one stable name.
  test-integration:
    name: Postgres journeys
    needs: test-integration-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-integration-shard.result }}" = success

  test-postgres-upgrade:
    name: Postgres upgrade
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash infra/compose/upgrade-postgres.docker-test.sh

  # Main leaves Web E2E to the nightly run. Gated inside the called workflow, so its "Web E2E"
  # check always reports.
  test-e2e:
    name: Web E2E
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/playwright.yml
    with:
      upload_artifacts: true
      e2e: ${{ needs.changes.outputs.e2e }}
      www: ${{ needs.changes.outputs.www }}

  # Publishes sha-<commit> and edge alongside the checks, so the production deploy pulls the
  # image this run built instead of building on the production host.
  publish-server-image:
    name: Publish server images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: ci-images-main
    uses: ./.github/workflows/publish-server-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets:
      LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}

  publish-mobile-update:
    name: Publish compatible mobile update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mobile-production-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the change is safe for OTA
        id: ota
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # Compare against the commit installed builds already run, not just this push, so a
          # change from a cancelled or skipped run is still published (or still blocks). Without
          # a published update for the current runtime, the commit that introduced the runtime
          # version anchors the diff, so a native change from an earlier push cannot escape it.
          runtime="$(jq -r .expo.version apps/mobile/app.json)"
          project="$(jq -r .expo.extra.eas.projectId apps/mobile/app.json)"
          # The GraphQL API reports failures inside an HTTP 200 body, and transport failures
          # leave no body; ota-base.sh must not read either as "no published update".
          # Filter before limiting: updates for other runtimes must not hide this runtime's base.
          response="$(
            curl -fsS --max-time 30 https://api.expo.dev/graphql \
              -H "authorization: Bearer $EXPO_TOKEN" \
              -H "content-type: application/json" \
              --data "$(jq -n --arg id "$project" --arg runtime "$runtime" '{
                query: "query($id: String!, $runtime: String!) { app { byId(appId: $id) { updateBranchByName(name: \"production\") { updates(offset: 0, limit: 50, filter: { runtimeVersions: [$runtime] }) { gitCommitHash runtimeVersion isRollBackToEmbedded } } } } }",
                variables: { id: $id, runtime: $runtime }
              }')"
          )" || response=""
          decision="$(bash .github/scripts/ota-base.sh "$response")"
          if [[ "$decision" == "unknown" ]]; then
            echo "::warning::Could not determine the last published update for runtime $runtime; not publishing this push."
            {
              echo "### Mobile OTA skipped"
              echo
              echo "Could not determine the last published update for runtime \`$runtime\`, so this job will not publish a partial-range update."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$decision" || "$decision" == "no-base" ]]; then
            {
              echo "### Mobile OTA skipped"
              echo
              echo "Found neither a published update for runtime \`$runtime\` on this history nor the commit that introduced the runtime version, so this job will not publish a partial-range update."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$decision"

          # Every package the mobile app resolves, transitive ones included, from the lockfile.
          mobile_dependencies() {
            git show "$1:pnpm-lock.yaml" | node .github/scripts/mobile-dependency-tree.mjs
          }

          mapfile -t files < <(
            git diff --name-only "$base" "$GITHUB_SHA" -- \
              apps/mobile \
              packages/chat-ui \
              packages/contracts \
              packages/core \
              packages/logging \
              packages/ui-tokens
          )
          if [[ "$(mobile_dependencies "$base")" != "$(mobile_dependencies "$GITHUB_SHA")" ]]; then
            files+=("pnpm-lock.yaml (mobile dependency tree)")
          fi

          printf '%s\n' "${files[@]}" | node scripts/release/mobile-ota.mjs "$base" "$GITHUB_STEP_SUMMARY" "$GITHUB_OUTPUT"

      - name: Require Expo automation token
        if: steps.ota.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add an EXPO_TOKEN repository secret with access to the inbox-zero/rakazo Expo project." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.ota.outputs.publish == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.ota.outputs.publish == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: steps.ota.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        if: steps.ota.outputs.publish == 'true'
        run: pnpm --filter @rakazo/mobile check
      - name: Publish production update
        if: steps.ota.outputs.publish == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          set -euo pipefail
          check_current_main() {
            local head
            head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ -z "$head" ]]; then
              echo "Could not resolve the current main head before publishing." >&2
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$head" ]]; then
              {
                echo "### Mobile OTA skipped"
                echo
                echo "This run is for \`$GITHUB_SHA\`, but \`main\` is now \`$head\`. Skipping so an older revision cannot overwrite a newer production update."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          }
          check_current_main
          if [[ -n "$SENTRY_AUTH_TOKEN" && ( -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ) ]]; then
            echo "Sentry uploads require SENTRY_ORG and SENTRY_PROJECT." >&2
            exit 1
          fi
          pnpm exec eas env:exec production 'pnpm exec expo export --platform ios --platform android --clear --source-maps --dump-assetmap' --non-interactive
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            # The SDK uploader only warns when there are no source maps; fail instead.
            if [[ -z "$(find dist -type f -name '*.map' -print -quit)" ]]; then
              echo "The mobile export has no source maps to upload." >&2
              exit 1
            fi
            SENTRY_URL="${SENTRY_URL:-https://sentry.io/}" pnpm exec sentry-expo-upload-sourcemaps dist
          fi
          check_current_main
          pnpm exec eas update --platform all --channel production --environment production --skip-bundler --input-dir dist --upload-source-maps --message "$GITHUB_SHA" --non-interactive

  deploy-production:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    # The host pulls the image published for this commit; it builds only if that pull fails.
    # Only checks that catch a broken server gate the deploy; lint, E2E, and Docker drills report on their own.
    needs: [checks, test-integration, publish-server-image]
    runs-on: ubuntu-latest
    # Matches infra/compose/deploy-main.sh's own limits, including a fallback build, rollback, and
    # waiting twice for a replaced worker to finish its jobs.
    timeout-minutes: 140
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    environment:
      name: production
      url: https://app.rakazo.com
    permissions:
      contents: read
      id-token: write
    steps:
      # Production SSH is reachable only over the tailnet; the runner joins with a short-lived
      # GitHub OIDC identity scoped to this environment, so no Tailscale secret is stored.
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.PRODUCTION_SSH_HOST }}

      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/rakazo-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rakazo-production" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/rakazo-production" >/dev/null

      - name: Deploy successful main revision
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh -F /dev/null \
            -i "$HOME/.ssh/rakazo-production" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" "deploy-main $GITHUB_SHA"
