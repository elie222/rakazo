name: preview-deploy

# Deploys the image preview-build.yml made. workflow_run runs this file from the default branch
# with the deploy secret, so nothing here may run the pull request's code: the image is only
# loaded and pushed, and every pull request value arrives through env, never ${{ }} in a script.
on:
  workflow_run:
    workflows: [preview-build]
    types: [completed]

permissions: {}

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      numbers: ${{ steps.pr.outputs.numbers }}
      pulls: ${{ steps.pr.outputs.pulls }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.FLY_API_TOKEN != ''
        with:
          persist-credentials: false
      - name: Find the pull request
        id: pr
        env:
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -z $FLY_API_TOKEN ]]; then
            echo "FLY_PREVIEW_TOKEN is not set; skipping."
            exit 0
          fi
          # Every open pull request from this branch at this commit; none when a newer push
          # superseded the build.
          pulls=$(python3 .github/scripts/pr-screenshots.py pulls "$REPO" "$HEAD_OWNER" "$HEAD_BRANCH" "$HEAD_SHA")
          echo "pulls=$pulls" >> "$GITHUB_OUTPUT"
          numbers=$(jq -r 'map(tostring) | join(" ")' <<< "$pulls")
          [[ -z $numbers ]] || echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.pr.outputs.numbers
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Load the image
        if: steps.pr.outputs.numbers
        run: |
          loaded=$(zstd -dc "$RUNNER_TEMP/preview/preview-image.tar.zst" | docker load)
          [[ $loaded == "Loaded image: rakazo-preview:pr" ]] || { echo "Unexpected image: $loaded"; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.pr.outputs.numbers
        with:
          version: 0.4.97
      - name: Deploy
        if: steps.pr.outputs.numbers
        env:
          PRS: ${{ steps.pr.outputs.numbers }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: rakazo-preview:pr
          FLY_ORG: ${{ vars.FLY_PREVIEW_ORG }}
          REGION: ${{ vars.FLY_PREVIEW_REGION || 'iad' }}
          APP_PREFIX: ${{ vars.FLY_PREVIEW_APP_PREFIX }}
        run: |
          for PR in $PRS; do
            PR=$PR bash infra/preview/deploy.sh
          done
      - name: Mark preview ready for screenshots
        if: steps.pr.outputs.numbers
        run: |
          mkdir -p "$RUNNER_TEMP/screenshot-ready"
          printf 'ready\n' > "$RUNNER_TEMP/screenshot-ready/ready.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.pr.outputs.numbers
        with:
          name: pr-screenshot-preview-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/screenshot-ready/ready.txt
          retention-days: 90
          overwrite: true

  screenshots:
    needs: deploy
    if: needs.deploy.outputs.numbers != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.deploy.outputs.pulls) }}
    uses: ./.github/workflows/pr-screenshots.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
      pull_request: ${{ matrix.pr }}
    secrets: inherit
