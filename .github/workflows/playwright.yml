name: Playwright

on:
  workflow_dispatch:
    inputs:
      sandbox_provider:
        description: Sandbox provider
        required: true
        type: choice
        options:
          - fake
          - e2b
          - daytona
          - boat
        default: fake
  workflow_call:
    inputs:
      sandbox_provider:
        description: Sandbox provider
        required: false
        type: string
        default: fake
      publish_report:
        description: Publish this run to the persistent visual dashboard
        required: false
        type: boolean
        default: false
      upload_artifacts:
        description: Retain the report and diagnostics as GitHub artifacts
        required: false
        type: boolean
        default: false
    secrets:
      S3_ACCESS_KEY_ID:
        description: Access key used to publish visual reports
        required: false
      S3_SECRET_ACCESS_KEY:
        description: Secret key used to publish visual reports
        required: false
      E2B_API_KEY:
        description: E2B API key used only when the E2B sandbox is selected
        required: false
      DAYTONA_API_KEY:
        description: Daytona API key used only when the Daytona sandbox is selected
        required: false
      BOAT_API_KEY:
        description: Boat API key used only when the Boat sandbox is selected
        required: false

permissions:
  contents: read

jobs:
  shard:
    name: Web E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        timeout-minutes: 5
        # Skip --with-deps: GitHub ubuntu-latest already has Chromium's OS libraries,
        # and apt-get against azure.archive.ubuntu.com can stall until the job timeout.
        run: pnpm --filter @rakazo/web exec playwright install chromium
      - name: Validate E2B credentials
        if: inputs.sandbox_provider == 'e2b'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: test -n "$E2B_API_KEY"
      - name: Validate Daytona credentials
        if: inputs.sandbox_provider == 'daytona'
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: test -n "$DAYTONA_API_KEY"
      - name: Validate Boat credentials
        if: inputs.sandbox_provider == 'boat'
        env:
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
        run: test -n "$BOAT_API_KEY"
      - name: Run Playwright tests
        id: playwright_tests
        env:
          SANDBOX_TEST_PROVIDER: ${{ inputs.sandbox_provider }}
          E2B_API_KEY: ${{ inputs.sandbox_provider == 'e2b' && secrets.E2B_API_KEY || '' }}
          DAYTONA_API_KEY: ${{ inputs.sandbox_provider == 'daytona' && secrets.DAYTONA_API_KEY || '' }}
          BOAT_API_KEY: ${{ inputs.sandbox_provider == 'boat' && secrets.BOAT_API_KEY || '' }}
          SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e -- --sandbox="$SANDBOX_TEST_PROVIDER" --shard="$SHARD/4"
      # Homepage screenshots only: no copy or layout assertions.
      # Runs after product e2e so shared apps/web/test-results is not wiped by the product run.
      - name: Capture marketing homepage screenshots
        if: matrix.shard == 1 && always() && (steps.playwright_tests.outcome == 'success' || steps.playwright_tests.outcome == 'failure')
        run: pnpm --filter @rakazo/www e2e
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            blob-report
            playwright-report-www
            apps/web/test-results
          # Matches the combined artifact, so re-running failed shards later still finds the others.
          retention-days: 7
          if-no-files-found: ignore

  # Keeps the single "Web E2E" check and artifact that branch protection and the publisher expect.
  playwright:
    name: Web E2E
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.publish_report && 'playwright-publication' || format('playwright-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: playwright-shard-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/shards
      - name: Combine shard results
        shell: bash
        env:
          SHARDS: ${{ runner.temp }}/shards
        run: |
          set -euo pipefail
          mkdir -p blob-report apps/web/test-results
          missing=0
          # A re-run of failed jobs uploads new attempts only for the shards it re-ran.
          for shard in 1 2 3 4; do
            latest=""
            for attempt in $(seq "$GITHUB_RUN_ATTEMPT" -1 1); do
              candidate="$SHARDS/playwright-shard-$shard-$GITHUB_RUN_ID-$attempt"
              if [[ -d "$candidate" ]]; then latest="$candidate"; break; fi
            done
            if [[ -z "$latest" ]]; then
              echo "::error::Shard $shard uploaded no results; the combined report is incomplete."
              missing=1
              continue
            fi
            if compgen -G "$latest/blob-report/*.zip" >/dev/null; then
              cp -R "$latest/blob-report/." blob-report/
            else
              echo "::error::Shard $shard has no Playwright blob report; the combined report is incomplete."
              missing=1
            fi
            if [[ -d "$latest/apps/web/test-results" ]]; then cp -R "$latest/apps/web/test-results/." apps/web/test-results/; fi
            if [[ -d "$latest/playwright-report-www" ]]; then cp -R "$latest/playwright-report-www" .; fi
          done
          exit "$missing"
      - name: Merge Playwright reports
        if: ${{ !cancelled() && hashFiles('blob-report/*.zip') != '' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm --filter @rakazo/web exec playwright merge-reports --reporter html "$GITHUB_WORKSPACE/blob-report"
      - name: Record Playwright result
        if: ${{ !cancelled() && inputs.upload_artifacts }}
        env:
          PLAYWRIGHT_RESULT: ${{ needs.shard.result == 'success' && job.status == 'success' && 'success' || 'failure' }}
        run: |
          mkdir -p test-report/e2e
          if [[ "$PLAYWRIGHT_RESULT" == "success" ]]; then
            printf 'success\n' > test-report/e2e/outcome.txt
          else
            printf 'failure\n' > test-report/e2e/outcome.txt
          fi
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            playwright-report-www
            apps/web/test-results
            test-report/e2e
          retention-days: 7
          if-no-files-found: warn
      - name: Publish Playwright visual report
        if: ${{ !cancelled() && inputs.publish_report }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}
          PLAYWRIGHT_RESULT: ${{ needs.shard.result == 'success' && job.status == 'success' && 'success' || 'failure' }}
          PLAYWRIGHT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}
          PLAYWRIGHT_RUN_NUMBER: ${{ github.run_number }}
          PLAYWRIGHT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_SHA: ${{ github.sha }}
          PLAYWRIGHT_EVENT: ${{ github.event_name }}
          PLAYWRIGHT_BRANCH: ${{ github.ref_name }}
        run: bash scripts/publish-playwright-report.sh
      - name: Fail when a shard failed
        if: needs.shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "Playwright shards finished with: $SHARD_RESULT" >&2
          exit 1
