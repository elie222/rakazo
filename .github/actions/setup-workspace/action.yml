name: Setup workspace
description: Install pnpm and Node, restore install and build caches, and install the workspace for CI jobs.
inputs:
  electron:
    description: Download and cache the Electron binary (needed for desktop smoke and native computer jobs).
    required: false
    default: "false"
  playwright:
    description: Restore the Playwright browser cache under ~/.cache/ms-playwright.
    required: false
    default: "false"
  turbo:
    description: Which turbo local cache to restore (none, check, or build).
    required: false
    default: "none"
  filter:
    description: Optional pnpm --filter argument (for example @rakazo/desktop...).
    required: false
    default: ""
  install:
    description: Run pnpm install after restoring caches.
    required: false
    default: "true"
  node-version:
    description: Node.js version for actions/setup-node.
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Cache Electron binary
      if: inputs.electron == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/electron-cache
        key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          electron-${{ runner.os }}-

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Restore turbo cache
      if: inputs.turbo == 'check' || inputs.turbo == 'build'
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.turbo }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ inputs.turbo }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        # Jobs that never launch Electron skip the multi-hundred-MB download.
        ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.electron == 'true' && '0' || '1' }}
        ELECTRON_CACHE: ${{ inputs.electron == 'true' && format('{0}/electron-cache', runner.temp) || '' }}
        # Prefer the restored content-addressable store over the network.
        npm_config_prefer_offline: "true"
      run: |
        set -euo pipefail
        filter_args=()
        if [[ -n "${{ inputs.filter }}" ]]; then
          filter_args=(--filter "${{ inputs.filter }}")
        fi
        pnpm install --frozen-lockfile "${filter_args[@]}"
