name: Feature request
description: A new capability or a change in how Rakazo behaves
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: One concrete situation, step by step, showing what you would see or do.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest version that would solve it, and which surfaces it covers (web, desktop, mobile).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
