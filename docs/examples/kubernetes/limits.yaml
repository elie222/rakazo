# See ../../self-host-kubernetes.md before applying.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rakazo-computers
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo-sandboxes
spec:
  hard:
    pods: "2"
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rakazo-computers
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo-sandboxes
spec:
  limits:
    - type: Container
      default:
        ephemeral-storage: 8Gi
      defaultRequest:
        ephemeral-storage: 2Gi
