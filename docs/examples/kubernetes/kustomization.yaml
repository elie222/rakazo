# See ../../self-host-kubernetes.md before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - rbac.yaml
  - storage.yaml
  - postgres.yaml
  - migrate.yaml
  - bootstrap.yaml
  - workloads.yaml
  - limits.yaml
  - network-policy.yaml
  - sandbox-policy.yaml
configMapGenerator:
  - name: rakazo-config
    namespace: rakazo
    envs:
      - config.env
  - name: rakazo-installation
    namespace: rakazo
    envs:
      - installation.env
  - name: rakazo-migration-state
    namespace: rakazo
    envs:
      - migration.env
secretGenerator:
  - name: rakazo-secrets
    namespace: rakazo
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
  labels:
    rakazo.example/phase: foundation
replacements:
  - source:
      kind: ConfigMap
      name: rakazo-installation
      fieldPath: data.KUBERNETES_API_CIDR
    targets:
      - select:
          kind: NetworkPolicy
          name: rakazo-(api|worker)
        fieldPaths:
          - spec.egress.5.to.0.ipBlock.cidr
  # Render the image boundary from the same setting as API/worker; no runtime
  # admission parameter lookup or extra ConfigMap access is needed by the controller.
  - source:
      kind: ConfigMap
      name: rakazo-config
      fieldPath: data.KUBERNETES_SANDBOX_COMPUTER_IMAGE
    targets:
      - select:
          kind: ValidatingAdmissionPolicy
          name: rakazo-example-computers
        fieldPaths:
          - spec.validations.0.expression
        options:
          delimiter: "'"
          index: 1
