# See ../../self-host-kubernetes.md before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rakazo-default-deny
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rakazo-computers
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo-sandboxes
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rakazo
      podSelector:
        matchLabels:
          app: rakazo-api
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rakazo
      podSelector:
        matchLabels:
          app: rakazo-worker
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rakazo
      podSelector:
        matchLabels:
          app: rakazo-web
    ports:
    - port: 6080
      protocol: TCP
    - port: 6100
      endPort: 6199
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 0.0.0.0/8
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/12
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 192.168.0.0/16
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/3
    ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rakazo-postgres
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  podSelector:
    matchLabels:
      app: rakazo-postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: rakazo-api
    - podSelector:
        matchLabels:
          app: rakazo-worker
    - podSelector:
        matchLabels:
          app: rakazo-migrate
    - podSelector:
        matchLabels:
          app: rakazo-bootstrap
    ports:
    - port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rakazo-web
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  podSelector:
    matchLabels:
      app: rakazo-web
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 5173
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: rakazo-api
    ports:
    - port: 3100
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rakazo-sandboxes
    ports:
    - port: 6080
      protocol: TCP
    - port: 6100
      endPort: 6199
      protocol: TCP
---
