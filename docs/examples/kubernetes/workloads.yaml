# See ../../self-host-kubernetes.md before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-api
  labels:
    rakazo.example/phase: app
  namespace: rakazo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rakazo-api
  template:
    metadata:
      labels:
        app: rakazo-api
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: api
        image: ghcr.io/elie222/rakazo/app@sha256:cec37eeb8230131ebf3e8aaf752e09439558d05e3581c6990734e8b4b515adeb
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: DATABASE_URL
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: ENCRYPTION_KEY
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: BETTER_AUTH_SECRET
        - name: SCREEN_PROXY_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: SCREEN_PROXY_SECRET
        envFrom:
        - configMapRef:
            name: rakazo-config
        command:
        - node
        - --enable-source-maps
        - dist/index.js
        workingDir: /app/apps/api
        ports:
        - containerPort: 3100
        readinessProbe:
          tcpSocket:
            port: 3100
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      terminationGracePeriodSeconds: 60
      serviceAccountName: rakazo-controller
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rakazo-data
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-api
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  selector:
    app: rakazo-api
  ports:
  - port: 3100
    targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-worker
  labels:
    rakazo.example/phase: app
  namespace: rakazo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rakazo-worker
  template:
    metadata:
      labels:
        app: rakazo-worker
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: worker
        image: ghcr.io/elie222/rakazo/app@sha256:cec37eeb8230131ebf3e8aaf752e09439558d05e3581c6990734e8b4b515adeb
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: DATABASE_URL
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: ENCRYPTION_KEY
        envFrom:
        - configMapRef:
            name: rakazo-config
        command:
        - node
        - --enable-source-maps
        - dist/index.js
        workingDir: /app/apps/worker
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - node
            - dist/health-check.js
          periodSeconds: 15
          timeoutSeconds: 5
      terminationGracePeriodSeconds: 3000
      serviceAccountName: rakazo-controller
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rakazo-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-web
  labels:
    rakazo.example/phase: app
  namespace: rakazo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rakazo-web
  template:
    metadata:
      labels:
        app: rakazo-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: web
        image: ghcr.io/elie222/rakazo/app@sha256:cec37eeb8230131ebf3e8aaf752e09439558d05e3581c6990734e8b4b515adeb
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: '2'
            memory: 768Mi
            ephemeral-storage: 2Gi
        env:
        - name: SCREEN_PROXY_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo-secrets
              key: SCREEN_PROXY_SECRET
        envFrom:
        - configMapRef:
            name: rakazo-config
        command:
        - node_modules/.bin/vite
        - preview
        - --host
        - 0.0.0.0
        - --port
        - '5173'
        workingDir: /app/apps/web
        ports:
        - containerPort: 5173
        readinessProbe:
          tcpSocket:
            port: 5173
          periodSeconds: 5
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-web
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  selector:
    app: rakazo-web
  ports:
  - port: 5173
    targetPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-web-peers
  namespace: rakazo
  labels:
    rakazo.example/phase: foundation
spec:
  clusterIP: None
  selector:
    app: rakazo-web
  ports:
  - port: 5173
    targetPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-ingress-peers
  namespace: kube-system
  labels:
    rakazo.example/phase: foundation
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: traefik
  ports:
  - port: 80
    targetPort: 8000
