appId: com.rakazo.app
name: Files
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///artifact?artifactId=${RAKAZO_SCREENSHOT_ARTIFACT_ID}"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-text
- openLink: "rakazo:///artifact?artifactId=${RAKAZO_SCREENSHOT_MARKDOWN_ID}"
- extendedWaitUntil:
    visible: ".*Collect customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-markdown
- openLink: "rakazo:///artifact?artifactId=${RAKAZO_SCREENSHOT_PDF_ID}"
- extendedWaitUntil:
    visible: ".*launch-brief.pdf.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-pdf
- openLink: "rakazo:///artifact?artifactId=${RAKAZO_SCREENSHOT_ARCHIVE_ID}"
- extendedWaitUntil:
    visible: ".*No preview.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-no-preview
- openLink: "rakazo:///image?artifactId=${RAKAZO_SCREENSHOT_IMAGE_ID}&name=launch-chart.png&mimeType=image%2Fpng&botId=${RAKAZO_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*launch-chart.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-image
- openLink: "rakazo:///artifact?artifactId=${RAKAZO_SCREENSHOT_VIDEO_ID}"
- extendedWaitUntil:
    visible: ".*launch-demo.mp4.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-video
