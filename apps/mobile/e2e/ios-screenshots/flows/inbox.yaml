appId: com.rakazo.app
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Researcher.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-inbox
# Start at the row's midpoint so the swipe reveals actions without committing one.
- swipe:
    from:
      text: ".*Researcher.*"
    direction: LEFT
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-swipe-actions
- tapOn: "Activity"
- extendedWaitUntil:
    visible: ".*Recent.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-activity
- tapOn: "Pages"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-pages-tab
- tapOn: "Routines"
- extendedWaitUntil:
    visible: ".*Researcher.*|.*set up a routine.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-routines-tab
- tapOn: "Chats"
- openLink: "rakazo:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-artifacts
