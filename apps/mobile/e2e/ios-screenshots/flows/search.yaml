appId: com.rakazo.app
name: Search
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
# The Search tab focuses its field: the system field in the tab bar on iOS 26, the screen's own
# field before it. Typing goes to whichever has focus.
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-search-empty
- inputText: "zzzz-no-such-fixture"
- extendedWaitUntil:
    visible: ".*No results.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-search-none
- tapOn:
    text: "Clear text"
    optional: true
- eraseText: 40
- inputText: "marigold"
- extendedWaitUntil:
    visible: ".*marigold checklist.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-search-results
