appId: com.rakazo.app
name: Search
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn:
    id: "home-search-button"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "search-sheet-field"
    commands:
      - tapOn: "Search"
# The field opens focused; tapping it again would raise the Paste menu over the results.
- extendedWaitUntil:
    visible:
      id: "search-sheet-field"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-search-empty
- inputText: "zzzz-no-such-fixture"
- extendedWaitUntil:
    visible: ".*No results.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-search-none
- tapOn:
    text: "Clear text"
    optional: true
- eraseText: 40
- inputText: "marigold"
- extendedWaitUntil:
    visible: ".*marigold checklist.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-search-results

- tapOn:
    id: "search-sheet-close"
