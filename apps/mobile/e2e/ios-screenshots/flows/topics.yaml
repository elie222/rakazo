appId: com.rakazo.app
name: Threads
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
# The chat shows the reply count under the message the thread replies to.
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*2 replies.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-reply-count
- openLink: "rakazo:///topics?botId=${RAKAZO_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-threads
- openLink: "rakazo:///topic?botId=${RAKAZO_SCREENSHOT_BOT_ID}&topicId=${RAKAZO_SCREENSHOT_TOPIC_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Can you add the pricing quotes too.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-thread
