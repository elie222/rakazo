appId: com.rakazo.app
name: Auth
---
- runFlow: ../subflows/launch-app.yaml
- runFlow:
    when:
      visible: "Sign in to Rakazo"
    commands:
      - tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-welcome
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Rakazo"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-sign-in
# The standard offline fixture offers email only. Capture the chooser too when
# a chooser is available; the offline backend itself configures no providers.
- runFlow:
    when:
      visible: "Continue with email"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 02-provider-chooser
      - tapOn: "Continue with email"
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: 02-email-sign-in
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: "wrong-password"
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Invalid email or password|Invalid credentials|Could not sign in"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-sign-in-error
- tapOn: "Use a custom server|Custom server"
- extendedWaitUntil:
    visible: "Server"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-custom-server
- tapOn:
    text: "http.*|https.*"
    optional: true
- eraseText: 80
- inputText: "::::"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "That doesn.*look like a URL|Could not reach that server|That URL did not look like a Rakazo server|Enter a server URL"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-server-error
- tapOn: "Cancel"
