appId: com.rakazo.app
name: Billing
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///billing"
- extendedWaitUntil:
    visible: ".*Renews.*|.*Plan.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-billing
- tapOn: "Standard"
- extendedWaitUntil:
    visible: "Max · .*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-billing-tiers
- openLink: "rakazo:///wallet"
- extendedWaitUntil:
    visible: "Disconnect"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-wallet
- openLink: "rakazo:///spending-limit"
- extendedWaitUntil:
    visible: "Amount.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-spending-limit-none
- tapOn: "Amount.*"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "200"
- takeScreenshot: 05-spending-limit-amount
- tapOn: "Save"
- extendedWaitUntil:
    visible: ".*spent this month.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-spending-limit-set
