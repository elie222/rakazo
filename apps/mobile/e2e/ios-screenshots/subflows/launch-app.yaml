appId: com.rakazo.app
---
# Restart without clearing app data, so a dev client's bundler URL stays put.
- launchApp:
    stopApp: true
- openLink: "rakazo:///account"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Your account|Sign up for Rakazo|Sign in to Rakazo"
    timeout: 40000
- runFlow:
    when:
      visible: "Your account"
    commands:
      - scrollUntilVisible:
          element: "Sign out"
          direction: DOWN
          timeout: 15000
      - tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Sign in to Rakazo"
    timeout: 20000
