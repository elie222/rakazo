plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rakazo.notifications'
version = '0.1.0'

android {
  namespace 'com.rakazo.notifications'
  defaultConfig {
    versionName '0.1.0'
  }
}

dependencies {
  def notifications = new groovy.json.JsonSlurper().parse(file('../../../node_modules/expo-notifications/expo-module.config.json')).android.publication
  implementation(findProject(':expo-notifications') ?: "${notifications.groupId}:${notifications.artifactId}:${notifications.version}")
  implementation 'com.google.firebase:firebase-messaging:25.0.1'

  testImplementation 'junit:junit:4.13.2'
  // The real parser: Android's own org.json is a stub in local unit tests.
  testImplementation 'org.json:json:20240303'
}
