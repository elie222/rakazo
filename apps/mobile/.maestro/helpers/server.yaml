appId: com.rakazo.app
---
# Reuse an already-open server sheet, or open it from authentication.
- runFlow:
    when:
      notVisible:
        id: "server-address"
    commands:
      - tapOn: "Use a custom server|Custom server.*"
- tapOn:
    id: "server-address"
- eraseText
- inputText: ${RAKAZO_MOBILE_API_URL}
- hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    notVisible:
      id: "server-address"
    timeout: 15000
