appId: com.rakazo.app
name: Rakazo organizations
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- tapOn: "Sign in"
- runFlow: helpers/server.yaml
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000

- openLink: "rakazo:///account"
- scrollUntilVisible:
    element: "Organization"
    direction: DOWN
- tapOn: "Organization"
- extendedWaitUntil:
    visible: "Create organization"
    timeout: 10000
- takeScreenshot: "40-account-organization"
- tapOn: "Create organization"
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
# The name field opens focused.
- inputText: "Work"
- takeScreenshot: "41-new-organization"
# The keyboard covers the sheet's Create button, and the inbox's + behind the sheet is also
# named "Create", so submit from the keyboard.
- pressKey: Enter
# The new organization's inbox asks for notifications again on Android.
- tapOn:
    text: "Don’t allow"
    optional: true

# The new organization opens empty, with the title switching between both.
- extendedWaitUntil:
    visible:
      id: "organization-menu"
    timeout: 15000
- assertNotVisible: "Researcher"
- waitForAnimationToEnd
- takeScreenshot: "42-organization-inbox"
- tapOn:
    id: "organization-menu"
- extendedWaitUntil:
    visible: "Personal"
    timeout: 10000
- assertVisible: "Work"
- takeScreenshot: "43-organization-menu"
- tapOn: "Personal"
- tapOn:
    text: "Don’t allow"
    optional: true
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "44-organization-switched"

- tapOn:
    id: "organization-menu"
- extendedWaitUntil:
    visible: "Personal"
    timeout: 10000
- tapOn: "Work"
- extendedWaitUntil:
    notVisible: "Researcher"
    timeout: 15000

# Deleting Work leaves the fixture with its one organization again.
- openLink: "rakazo:///account"
- extendedWaitUntil:
    visible: "Organization"
    timeout: 10000
- extendedWaitUntil:
    visible: "Work"
    timeout: 10000
- tapOn: "Organization"
- extendedWaitUntil:
    visible: "Delete organization"
    timeout: 10000
- takeScreenshot: "45-organization"
- tapOn: "Delete organization"
# The confirmation field opens focused.
- inputText: "Work"
- takeScreenshot: "46-organization-delete-confirm"
# The keyboard's backspace key is also named "Delete".
- hideKeyboard
- tapOn: "^Delete$"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 15000
- assertNotVisible:
    id: "organization-menu"
