appId: com.rakazo.app
name: Traditional Chinese language selection persists
# Run against a signed-in test account on an English device.
---
- launchApp
# A link sent during a cold start can arrive before the router; open it from the inbox.
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///language"
- extendedWaitUntil:
    visible: "Language"
    timeout: 10000
- assertVisible: "简体中文"
- tapOn: "繁體中文"
- assertVisible: "語言"
- takeScreenshot: "ui-locale-zh-tw"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///language"
- extendedWaitUntil:
    visible: "語言"
    timeout: 10000
- tapOn: "English"
- assertVisible: "Language"
