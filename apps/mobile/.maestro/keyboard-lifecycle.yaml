appId: com.rakazo.app
name: Keyboard lifecycle regression
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- runFlow:
    when:
      notVisible:
        id: "server-address"
    commands:
      - assertVisible: "Sign in to Rakazo"
      - takeScreenshot: "01-sign-in"
      - tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- runFlow: helpers/server.yaml

- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 15000
- tapOn: "Message Researcher"
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-initial"
- pressKey: Home
- launchApp:
    stopApp: false
- tapOn: "Message Researcher"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-resumed"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- tapOn: "Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 15000
- tapOn: "Message Researcher"
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-restarted"
- hideKeyboard
- openLink: "rakazo:///account"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in to Rakazo"
    timeout: 15000
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 15000
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 15000
- tapOn: "Message Researcher"
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-signed-in-again"
- hideKeyboard
