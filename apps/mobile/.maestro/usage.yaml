appId: com.rakazo.app
name: Android quota usage screen
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- tapOn:
    id: com.android.permissioncontroller:id/permission_deny_button
    optional: true
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- runFlow: helpers/server.yaml
- tapOn:
    text: "Retry"
    optional: true
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 15000
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    id: com.android.permissioncontroller:id/permission_deny_button
    optional: true
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///usage"
- extendedWaitUntil:
    visible: "OpenCode Go"
    timeout: 10000
- assertVisible: "Session"
- assertVisible: "Weekly"
- assertVisible: "Monthly"
- assertVisible: "46% remaining"
- assertVisible: "Sort by"
- assertVisible: "Most remaining"
- takeScreenshot: "11b-usage"
