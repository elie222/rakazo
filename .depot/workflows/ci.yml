# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: ci
# Trial: the pull request test suites only, beside the GitHub Actions run, to compare speed and
# reliability. Nothing here publishes, deploys or reads a secret; .github/workflows/ci.yml stays
# the required check.
on:
  pull_request:
permissions:
  contents: read
# Superseded PR checks cancel together. On main, each job that leads to a deploy holds a per-job
# lock: one revision runs while only the newest waits, so a burst of merges deploys its last commit
# without stopping work already in progress. Main reruns only what the deploy needs; the pull
# request already ran the rest against the then-current main, and the nightly run refreshes the
# E2E screenshot baseline.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Testcontainers pulls Docker Hub images through Google's public mirror: anonymous Docker Hub pulls
# from shared runner IPs fail intermittently with "authentication required" or rate limits.
env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
jobs:
  # Pull requests skip suites their files cannot affect (see .github/scripts/changed-areas.sh). A
  # suite gated here never takes a runner, and a job skipped by `if` still satisfies a required
  # check. Gates read `!= 'false'`, so main (which skips this job) and a failed classification run
  # everything.
  changes:
    name: Changed areas
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    outputs:
      server: ${{ steps.areas.outputs.server }}
      native: ${{ steps.areas.outputs.native }}
      compose: ${{ steps.areas.outputs.compose }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      www: ${{ steps.areas.outputs.www }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The merge commit's first parent is the base, so this diff is exactly what the PR adds.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
      - id: areas
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
  # A marketing-site or docs change builds only the site.
  build:
    name: Production builds
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' && (needs.changes.outputs.web != 'false' || needs.changes.outputs.www != 'false')
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    env:
      WEB: ${{ needs.changes.outputs.web != 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.depot/actions/setup-workspace
        with:
          electron: ${{ env.WEB }}
          turbo: build
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build the marketing site
        if: env.WEB != 'true'
        run: pnpm exec turbo build --filter=@rakazo/www
      # The size budgets read the bundles this step just built, in a fraction of a second.
      - run: pnpm build && node scripts/checks/bundle-size.mjs
        if: env.WEB == 'true'
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
          BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - name: Save turbo build cache
        if: success() && env.WEB == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Electron smoke
        if: env.WEB == 'true'
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: xvfb-run --auto-servernum pnpm --filter @rakazo/desktop exec playwright test --config e2e/playwright.config.ts
      - name: Upload desktop setup screenshots
        if: always() && env.WEB == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-screenshots
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore
  # A deploy needs these jobs, so like Postgres journeys they check their own changed areas to reach
  # their main locks in push order. Pull requests typecheck and test only the packages their files
  # touch and the packages that depend on them, unless a change sits outside the package graph;
  # main always runs everything.
  static-checks:
    name: Lint and typecheck
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 25
    concurrency:
      group: ci-checks-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - uses: ./.depot/actions/setup-workspace
        with:
          turbo: ${{ github.event_name == 'pull_request' && 'check' || 'none' }}
      - name: Lint
        if: github.event_name == 'pull_request'
        run: pnpm lint
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Typecheck
        if: steps.areas.outputs.all_packages != 'false'
        run: pnpm check
      - name: Typecheck affected packages
        if: steps.areas.outputs.all_packages == 'false'
        run: pnpm check --affected
        env:
          TURBO_SCM_BASE: HEAD^1
      - name: Save typecheck cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-check-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Host operations safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 infra/compose/host-safeguards.test.py
      - name: Preview startup tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 infra/preview/start.test.py
      - name: Codex subscription auth safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/codex-subscription-auth.test.py
      - name: Dependency update patch safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/dependency-update-patch.test.py
      - name: Issue triage labeling tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/apply-issue-triage.test.py
      - name: PR screenshot section tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/pr-screenshots.test.py
      - name: Changed-area classification tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/changed-areas.test.py
      - name: Mobile OTA base selection tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/ota-base.test.py
      - name: App Store review submission tests
        if: steps.areas.outputs.all_packages != 'false'
        run: node --test .github/scripts/app-store-review.test.mjs
      - name: Script tests
        run: node --test scripts/lazy-vendors.test.mjs scripts/checks/*.test.mjs scripts/release/*.test.mjs
  # Four runners finish the unit suite before the Web E2E shards, which set the pull request's
  # finish time; more runners only add per-job setup and queue for the account's runner limit. A
  # shard the classification leaves out stops after checkout.
  unit-tests-shard:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 20
    concurrency:
      group: ci-unit-${{ matrix.shard }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - id: unit
        env:
          SHARDS: ${{ steps.areas.outputs.unit_shards || '[1,2,3,4]' }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "run=$(jq --argjson shard "$SHARD" 'index($shard) != null' <<<"$SHARDS")" >> "$GITHUB_OUTPUT"
          # A single selected shard runs every test itself rather than a quarter of them.
          echo "whole=$(jq 'length == 1' <<<"$SHARDS")" >> "$GITHUB_OUTPUT"
      - uses: ./.depot/actions/setup-workspace
        if: steps.unit.outputs.run == 'true'
      - run: pnpm db:generate
        if: steps.unit.outputs.run == 'true'
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Install age for the encrypted backup round trip
        if: steps.unit.outputs.run == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
      - name: Unit tests
        if: steps.unit.outputs.run == 'true' && steps.areas.outputs.all_packages != 'false'
        env:
          WHOLE: ${{ steps.unit.outputs.whole }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$WHOLE" == true ]]; then pnpm run test; else pnpm run test --shard="$SHARD/4"; fi
      - name: Unit tests for affected packages
        if: steps.unit.outputs.run == 'true' && steps.areas.outputs.all_packages == 'false'
        env:
          TURBO_SCM_BASE: HEAD^1
          WHOLE: ${{ steps.unit.outputs.whole }}
        run: |
          affected="$(pnpm exec turbo ls --affected --output=json | jq -r '.packages.items[].path + "/"')"
          mapfile -t packages < <(printf "%s" "$affected")
          # These read other packages' files without importing them, so the package graph misses them.
          targets=("${packages[@]}" \
            .agents/skills/translate/catalog-gaps.test.ts \
            infra/updater/src/compose-env.test.ts \
            packages/adapters/src/builtin-skills.test.ts \
            packages/adapters/src/providers/messaging/lark/lark-lazy-loading.test.ts \
            packages/page-kit/src/kit/labels.test.tsx \
            packages/testkit/src/eas-pnpm-version.test.ts \
            packages/testkit/src/ios-screenshot-catalog.test.ts)
          # Vitest rejects more shards than test files, so a small set runs whole on the first shard.
          files="$(pnpm exec vitest list --filesOnly "${targets[@]}" | grep -c '\.test\.' || true)"
          if [[ "$WHOLE" == true ]] || (( files < 4 )); then
            (( ${{ matrix.shard }} == 1 )) || exit 0
            pnpm exec vitest run "${targets[@]}"
          else
            pnpm exec vitest run "${targets[@]}" --shard=${{ matrix.shard }}/4
          fi
  # The required check and the deploy gate, under one stable name.
  checks:
    name: Checks
    needs: [static-checks, unit-tests-shard]
    if: always()
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - run: test "${{ needs.static-checks.result }}" = success && test "${{ needs.unit-tests-shard.result }}" = success
  test-integration-shard:
    name: Postgres journeys (${{ matrix.shard }}/4)
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-postgres-${{ matrix.shard }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - name: Start Postgres
        if: steps.areas.outputs.server != 'false'
        uses: ./.depot/actions/start-postgres
      - uses: ./.depot/actions/setup-workspace
        if: steps.areas.outputs.server != 'false'
      - name: Wait for Postgres
        if: steps.areas.outputs.server != 'false'
        run: bash .depot/actions/start-postgres/wait.sh
      - run: pnpm test:integration --shard=${{ matrix.shard }}/4
        if: steps.areas.outputs.server != 'false'
  # The required check and the deploy gate, under one stable name.
  test-integration:
    name: Postgres journeys
    needs: test-integration-shard
    if: always()
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - run: test "${{ needs.test-integration-shard.result }}" = success
  test-postgres-upgrade:
    name: Postgres upgrade
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash infra/compose/upgrade-postgres.docker-test.sh
  # Main leaves Web E2E to the nightly run. Gated inside the called workflow, so its "Web E2E"
  # check always reports.
  test-e2e:
    name: Web E2E
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: ./.depot/workflows/playwright.yml
    with:
      upload_artifacts: true
      e2e: ${{ needs.changes.outputs.e2e }}
      www: ${{ needs.changes.outputs.www }}
