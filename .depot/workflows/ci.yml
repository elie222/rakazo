name: ci
# Pull request test suites on Depot's runners. The jobs live in .github/workflows/test-suites.yml
# , which GitHub runs for pushes to main; Web E2E, native computer, publishing and
# deploys stay in .github/workflows/ci.yml. Nothing here reads a secret, so fork pull requests run
# the same way.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test-suites.yml
    with:
      runner: depot-ubuntu-latest
