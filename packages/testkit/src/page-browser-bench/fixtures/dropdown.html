<!doctype html>
<title>Shipping</title>
<h1>Shipping</h1>
<form method="post" action="/submit">
  <label>Country
    <select name="country">
      <option value="">Choose a country</option>
      <option value="ar">Argentina</option><option value="au">Australia</option>
      <option value="br">Brazil</option><option value="ca">Canada</option>
      <option value="de">Germany</option><option value="es">Spain</option>
      <option value="fr">France</option><option value="in">India</option>
      <option value="jp">Japan</option><option value="mx">Mexico</option>
      <option value="nl">Netherlands</option><option value="uk">United Kingdom</option>
      <option value="us">United States</option>
    </select>
  </label>
  <button type="submit">Save country</button>
</form>
