# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
reviews:
  # No "review skipped" comment on the PRs CodeRabbit sits out.
  review_status: false
  # Greptile is the default reviewer; CodeRabbit only reviews PRs labeled
  # review:cr (see .github/workflows/review-bot.yml).
  auto_review:
    enabled: false
    labels:
      - "review:cr"
  tools:
    # Biome owns this repo's CSS (see biome.json and `pnpm lint`); Stylelint is not
    # installed or configured here, so its findings are about rules we do not run.
    stylelint:
      enabled: false
